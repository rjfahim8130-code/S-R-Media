<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>হোম - NnowQuiz</title>
  
  <meta name="monetag" content="5d5bd8350ba1e36f1af8d3b4b95c4595">
  <meta name="8645434d5e68c17799df1ccb083d05cc97221a9c" content="8645434d5e68c17799df1ccb083d05cc97221a9c" />
  <meta name="clckd" content="85de58977d8432e90f4c1b625a374f3d" />

  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="ads.js"></script>
</head>
<body>
  <div class="container page">
    <div class="header">
      <div class="logo">NnowQuiz</div>
      <div id="userPoints" class="badge badge-primary" style="font-size:0.9rem;padding:6px 12px;">০ পয়েন্ট</div>
    </div>

    <div class="card" style="background:linear-gradient(135deg,#312e81,#1e1b4b);">
      <h2 style="font-size:1.3rem;margin-bottom:6px;">হাই, <span id="userName">ইউজার</span>! 👋</h2>
      <p class="text-muted" style="font-size:0.95rem;">আজকের কুইজে অংশ নিয়ে পয়েন্ট জিতুন</p>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="totalPoints">০</div>
        <div class="stat-label">মোট পয়েন্ট</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="totalQuizzes">০</div>
        <div class="stat-label">কুইজ সম্পন্ন</div>
      </div>
    </div>

    <!-- সেশন প্রোগ্রেস -->
    <div class="card" id="sessionCard">
      <div class="card-title">আজকের সেশন</div>
      <p id="sessionText" class="mb-2" style="font-size:0.95rem;"></p>
      <div style="background:var(--dark-3);border-radius:10px;height:10px;overflow:hidden;">
        <div id="sessionProgressBar" style="height:100%;width:0%;background:linear-gradient(90deg,#6366f1,#c084fc);border-radius:10px;transition:width 0.4s;"></div>
      </div>
      <p id="sessionCountText" class="text-muted mt-2" style="font-size:0.85rem;"></p>
    </div>

    <!-- কুইজ খেলুন -->
    <div class="card">
      <div class="card-title">কুইজ খেলুন</div>
      <p id="quizMotivation" class="mb-3" style="font-size:0.95rem;line-height:1.5;"></p>
      <button class="btn btn-primary" id="startQuizBtn">কুইজ শুরু করুন</button>
      <p id="quizStatus" class="text-muted text-center mt-2" style="font-size:0.85rem;"></p>
    </div>

    <!-- অ্যাড বক্স -->
    <div id="homeBannerAd" style="min-height:90px;margin:16px 0;display:flex;justify-content:center;align-items:center;"></div>

    <div class="card">
      <div class="card-title">প্রবন্ধ পড়ুন</div>
      <p class="text-muted mb-2" style="font-size:0.9rem;">ফ্রি প্রবন্ধ পড়ে জ্ঞান বাড়ান</p>
      <a href="articles.html" class="btn btn-secondary">সব প্রবন্ধ দেখুন</a>
    </div>

    <div class="card">
      <div class="card-title">রেফার ও বোনাস</div>
      <a href="refer.html" class="btn btn-secondary">রেফার করুন ও বোনাস নিন</a>
    </div>
  </div>

  <!-- বটম ন্যাভ -->
  <div class="bottom-nav">
    <a href="home.html" class="nav-item active">
      <span>🏠</span>
      <span>হোম</span>
    </a>
    <a href="articles.html" class="nav-item">
      <span>📖</span>
      <span>প্রবন্ধ</span>
    </a>
    <a href="leaderboard.html" class="nav-item">
      <span>🏆</span>
      <span>লিডারবোর্ড</span>
    </a>
    <a href="profile.html" class="nav-item">
      <span>👤</span>
      <span>প্রোফাইল</span>
    </a>
  </div>

  <script>
    let profile = null;

    async function init() {
      const user = await requireAuth();
      if (!user) return;
      profile = await getProfile();
      if (!profile) return;

      document.getElementById('userName').innerText = profile.full_name || profile.name || 'ইউজার';
      document.getElementById('userPoints').innerText = formatNumber(profile.coins || 0) + ' পয়েন্ট';
      document.getElementById('totalPoints').innerText = formatNumber(profile.coins || 0);
      document.getElementById('totalQuizzes').innerText = formatNumber(profile.total_quizzes || 0);

      // অ্যাড দেখাও
      AdManager.showBanner('homeBannerAd');
      AdManager.showMultiTag(); // সেশন শুরুতে একবার

      await loadSessionInfo();
    }

    async function loadSessionInfo() {
      const { data: settings } = await sb.from('app_settings').select('*');
      const map = {};
      (settings || []).forEach(s => map[s.key] = s.value);

      const sessionLimit = parseInt(map.session_quiz_limit || '8');
      const dailySessionLimit = parseInt(map.daily_session_limit || '5');
      const cooldownMin = parseInt(map.cooldown_minutes || '80');

      if (map.quiz_paused === 'true') {
        document.getElementById('startQuizBtn').disabled = true;
        document.getElementById('startQuizBtn').innerText = 'কুইজ বর্তমানে বন্ধ';
        document.getElementById('quizStatus').innerText = 'অ্যাডমিন কুইজ পজ করেছেন';
        document.getElementById('quizMotivation').innerText = 'এখন কুইজ বন্ধ আছে। পরে আবার চেষ্টা করুন।';
        return;
      }

      // বর্তমান সেশনের কুইজ (কুলডাউন অনুযায়ী)
      const cooldownAgo = new Date(Date.now() - cooldownMin * 60 * 1000).toISOString();
      const { data: recent } = await sb.from('quiz_submissions')
        .select('id, submitted_at')
        .eq('user_id', profile.id)
        .gte('submitted_at', cooldownAgo)
        .order('submitted_at', { ascending: false });

      const completedInSession = recent ? recent.length : 0;
      const remaining = Math.max(0, sessionLimit - completedInSession);

      // আজকের মোট সেশন হিসাব (সরল)
      const todayStart = new Date();
      todayStart.setHours(0,0,0,0);
      const { data: todaySubs } = await sb.from('quiz_submissions')
        .select('submitted_at')
        .eq('user_id', profile.id)
        .gte('submitted_at', todayStart.toISOString());

      // আনুমানিক সেশন সংখ্যা
      const todayCount = todaySubs ? todaySubs.length : 0;
      const approxSessions = Math.ceil(todayCount / sessionLimit);

      // প্রোগ্রেস বার
      const percent = (completedInSession / sessionLimit) * 100;
      document.getElementById('sessionProgressBar').style.width = percent + '%';

      if (completedInSession === 0) {
        document.getElementById('sessionText').innerHTML = `🔥 নতুন সেশন শুরু করুন! ${sessionLimit}টি কুইজ সম্পন্ন করে পুরস্কারের দিকে এগিয়ে যান`;
      } else if (completedInSession < sessionLimit) {
        document.getElementById('sessionText').innerHTML = `🎯 আপনি <strong>${completedInSession}/${sessionLimit}</strong> টি কুইজ সম্পন্ন করেছেন। বাকি ${remaining}টি শেষ করুন!`;
      } else {
        document.getElementById('sessionText').innerHTML = `🏆 দারুণ! এই সেশনের ${sessionLimit}টি কুইজ সম্পন্ন হয়েছে।`;
        document.getElementById('startQuizBtn').disabled = true;
        document.getElementById('startQuizBtn').innerText = 'সেশন লিমিট শেষ';
        document.getElementById('quizStatus').innerText = `${cooldownMin} মিনিট পর আবার খেলতে পারবেন`;
      }

      document.getElementById('sessionCountText').innerText = `আজকের আনুমানিক সেশন: ${Math.min(approxSessions, dailySessionLimit)}/${dailySessionLimit}`;

      // উৎসাহমূলক বাক্য
      let motivation = '';
      if (completedInSession === 0) {
        motivation = '🚀 প্রথম কুইজ দিয়ে শুরু করুন! প্রতিটি সঠিক উত্তরে ১০ কয়েন পান।';
      } else if (completedInSession <= 2) {
        motivation = `💪 আপনি ${completedInSession}/${sessionLimit} টি সম্পন্ন করেছেন। গতি ধরে রাখুন!`;
      } else if (completedInSession <= 5) {
        motivation = `🔥 চমৎকার অগ্রগতি! ${completedInSession}/${sessionLimit} সম্পন্ন। আর একটু চেষ্টা করুন!`;
      } else if (completedInSession < sessionLimit) {
        motivation = `⭐ প্রায় শেষ! শুধু ${remaining}টি কুইজ বাকি। পুরস্কার নিশ্চিত করতে এগিয়ে যান!`;
      } else {
        motivation = `🎉 এই সেশনের সব কুইজ সম্পন্ন! ${cooldownMin} মিনিট পর আবার খেলতে পারবেন।`;
      }
      document.getElementById('quizMotivation').innerHTML = motivation;
    }

    document.getElementById('startQuizBtn').addEventListener('click', () => {
      window.location.href = 'quiz.html';
    });

    function formatNumber(num) {
      return new Intl.NumberFormat('bn-BD').format(num || 0);
    }

    init();
  </script>
</body>
</html>
