<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>হোম - NnowQuiz</title>
  
  <meta name="monetag" content="5d5bd8350ba1e36f1af8d3b4b95c4595">
  <meta name="8645434d5e68c17799df1ccb083d05cc97221a9c" content="8645434d5e68c17799df1ccb083d05cc97221a9c" />
  <meta name="clckd" content="85de58977d8432e90f4c1b625a374f3d" />

  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
</head>
<body>
  <div class="container page">
    <div class="header">
      <div class="logo">NnowQuiz</div>
      <div id="userPoints" class="badge badge-primary" style="font-size:0.9rem;padding:6px 12px;">০ পয়েন্ট</div>
    </div>

    <div class="card" style="background:linear-gradient(135deg,#312e81,#1e1b4b);">
      <h2 style="font-size:1.3rem;margin-bottom:6px;">হাই, <span id="userName">ইউজার</span>! 👋</h2>
      <p class="text-muted" style="font-size:0.95rem;">আজকের কুইজে অংশ নিয়ে পয়েন্ট জিতুন</p>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="totalPoints">০</div>
        <div class="stat-label">মোট পয়েন্ট</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="totalQuizzes">০</div>
        <div class="stat-label">কুইজ সম্পন্ন</div>
      </div>
    </div>

    <!-- সেশন প্রোগ্রেস কার্ড -->
    <div class="card" id="sessionCard">
      <div class="card-title">আজকের সেশন</div>
      <p id="sessionText" class="mb-2" style="font-size:0.95rem;"></p>
      <div style="background:var(--dark-3);border-radius:10px;height:10px;overflow:hidden;">
        <div id="sessionProgressBar" style="height:100%;width:0%;background:linear-gradient(90deg,#6366f1,#c084fc);border-radius:10px;transition:width 0.4s;"></div>
      </div>
    </div>

    <!-- কুইজ খেলুন কার্ড -->
    <div class="card">
      <div class="card-title">কুইজ খেলুন</div>
      <p id="quizMotivation" class="mb-3" style="font-size:0.95rem;line-height:1.5;"></p>
      <button class="btn btn-primary" id="startQuizBtn">কুইজ শুরু করুন</button>
      <p id="quizStatus" class="text-muted text-center mt-2" style="font-size:0.85rem;"></p>
    </div>

    <div class="card">
      <div class="card-title">প্রবন্ধ পড়ুন</div>
      <a href="articles.html" class="btn btn-secondary">সব প্রবন্ধ দেখুন</a>
    </div>

    <div class="card">
      <div class="card-title">লিডারবোর্ড</div>
      <a href="leaderboard.html" class="btn btn-outline">লিডারবোর্ড দেখুন</a>
    </div>
  </div>

  <div class="bottom-nav">
    <a href="home.html" class="nav-item active"><span class="icon">🏠</span><span>হোম</span></a>
    <a href="articles.html" class="nav-item"><span class="icon">📚</span><span>প্রবন্ধ</span></a>
    <a href="leaderboard.html" class="nav-item"><span class="icon">🏆</span><span>র‍্যাঙ্ক</span></a>
    <a href="profile.html" class="nav-item"><span class="icon">👤</span><span>প্রোফাইল</span></a>
  </div>

  <script>
    let profile = null;

    async function init() {
      const user = await requireAuth();
      if (!user) return;

      profile = await getProfile();
      if (!profile) {
        showToast('প্রোফাইল লোড সমস্যা', 'error');
        return;
      }

      document.getElementById('userName').innerText = profile.full_name || 'ইউজার';
      document.getElementById('totalPoints').innerText = formatNumber(profile.coins);
      document.getElementById('userPoints').innerText = formatNumber(profile.coins) + ' পয়েন্ট';
      document.getElementById('totalQuizzes').innerText = formatNumber(profile.total_quizzes_submitted);

      // কুইজ পজ চেক
      const { data: settings } = await sb.from('app_settings').select('value').eq('key', 'quiz_paused').maybeSingle();
      if (settings && settings.value === 'true') {
        document.getElementById('startQuizBtn').disabled = true;
        document.getElementById('startQuizBtn').innerText = 'কুইজ বর্তমানে বন্ধ';
        document.getElementById('quizStatus').innerText = 'অ্যাডমিন কুইজ পজ করেছেন';
        document.getElementById('quizMotivation').innerText = 'এখন কুইজ বন্ধ আছে। পরে আবার চেষ্টা করুন।';
        return;
      }

      // বর্তমান সেশনের কুইজ সংখ্যা (শেষ ২ ঘণ্টা)
      const twoHoursAgo = new Date(Date.now() - 2 * 60 * 60 * 1000).toISOString();
      const { data: recent } = await sb
        .from('quiz_submissions')
        .select('id')
        .eq('user_id', profile.id)
        .gte('submitted_at', twoHoursAgo);

      const completedInSession = recent ? recent.length : 0;
      const remaining = Math.max(0, 8 - completedInSession);

      // সেশন প্রোগ্রেস
      const sessionPercent = (completedInSession / 8) * 100;
      document.getElementById('sessionProgressBar').style.width = sessionPercent + '%';

      if (completedInSession === 0) {
        document.getElementById('sessionText').innerHTML = '🔥 আজকের সেশন শুরু করুন! ৮টি কুইজ সম্পন্ন করে পুরস্কারের দিকে এগিয়ে যান';
      } else if (completedInSession < 8) {
        document.getElementById('sessionText').innerHTML = `🎯 আপনি <strong>${completedInSession}/৮</strong> টি কুইজ সম্পন্ন করেছেন। বাকি ${remaining}টি শেষ করুন!`;
      } else {
        document.getElementById('sessionText').innerHTML = '🏆 দারুণ! এই সেশনের ৮টি কুইজ সম্পন্ন হয়েছে। পরের সেশনের জন্য অপেক্ষা করুন।';
        document.getElementById('startQuizBtn').disabled = true;
        document.getElementById('startQuizBtn').innerText = 'সেশন লিমিট শেষ';
      }

      // উৎসাহমূলক বাক্য
      let motivation = '';
      if (completedInSession === 0) {
        motivation = '🚀 প্রথম কুইজ দিয়ে শুরু করুন! প্রতিটি সঠিক উত্তরে ১০ কয়েন পান।';
      } else if (completedInSession <= 2) {
        motivation = `💪 আপনি ${completedInSession}/৮ টি সম্পন্ন করেছেন। গতি ধরে রাখুন, পুরস্কার কাছে!`;
      } else if (completedInSession <= 5) {
        motivation = `🔥 চমৎকার অগ্রগতি! ${completedInSession}/৮ সম্পন্ন। আর একটু চেষ্টা করুন!`;
      } else if (completedInSession < 8) {
        motivation = `⭐ প্রায় শেষ! শুধু ${remaining}টি কুইজ বাকি। পুরস্কার নিশ্চিত করতে এগিয়ে যান!`;
      } else {
        motivation = '🎉 এই সেশনের সব কুইজ সম্পন্ন! দুই ঘণ্টা পর আবার খেলতে পারবেন।';
      }
      document.getElementById('quizMotivation').innerHTML = motivation;
    }

    document.getElementById('startQuizBtn').addEventListener('click', () => {
      window.location.href = 'quiz.html';
    });

    init();
  </script>
</body>
</html>
