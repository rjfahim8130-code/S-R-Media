<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>হোম - NnowQuiz</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container page">
    <div class="header">
      <div class="logo">NnowQuiz</div>
      <div id="userPoints" class="badge badge-primary" style="font-size:0.9rem;padding:6px 12px;">০ পয়েন্ট</div>
    </div>

    <div class="card" style="background:linear-gradient(135deg,#312e81,#1e1b4b);">
      <h2 style="font-size:1.3rem;margin-bottom:6px;">হাই, <span id="userName">ইউজার</span>! 👋</h2>
      <p class="text-muted" style="font-size:0.95rem;">আজকের কুইজে অংশ নিয়ে পয়েন্ট জিতুন</p>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="totalPoints">০</div>
        <div class="stat-label">মোট পয়েন্ট</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="totalQuizzes">০</div>
        <div class="stat-label">কুইজ সম্পন্ন</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">কুইজ খেলুন</div>
      <p class="text-muted mb-3" style="font-size:0.9rem;">প্রবন্ধ পড়ে কুইজ দিয়ে পয়েন্ট জিতুন</p>
      <button class="btn btn-primary" id="startQuizBtn" onclick="startQuiz()">কুইজ শুরু করুন</button>
      <p id="quizStatus" class="text-muted text-center mt-2" style="font-size:0.85rem;"></p>
    </div>

    <div class="card">
      <div class="card-title">প্রবন্ধ পড়ুন</div>
      <a href="articles.html" class="btn btn-secondary">সব প্রবন্ধ দেখুন</a>
    </div>

    <div class="card">
      <div class="card-title">লিডারবোর্ড</div>
      <a href="leaderboard.html" class="btn btn-outline">লিডারবোর্ড দেখুন</a>
    </div>
  </div>

  <div class="bottom-nav">
    <a href="home.html" class="nav-item active"><span class="icon">🏠</span><span>হোম</span></a>
    <a href="articles.html" class="nav-item"><span class="icon">📚</span><span>প্রবন্ধ</span></a>
    <a href="leaderboard.html" class="nav-item"><span class="icon">🏆</span><span>র‍্যাঙ্ক</span></a>
    <a href="profile.html" class="nav-item"><span class="icon">👤</span><span>প্রোফাইল</span></a>
  </div>

  <script src="supabase.js"></script>
  <script>
    let profile = null;
    let quizPaused = false;

    async function init() {
      const user = await requireAuth();
      if (!user) return;

      profile = await getProfile();
      if (!profile) {
        showToast('প্রোফাইল লোড সমস্যা', 'error');
        return;
      }

      document.getElementById('userName').innerText = profile.full_name || 'ইউজার';
      document.getElementById('totalPoints').innerText = formatNumber(profile.coins);
      document.getElementById('userPoints').innerText = formatNumber(profile.coins) + ' পয়েন্ট';
      document.getElementById('totalQuizzes').innerText = formatNumber(profile.total_quizzes_submitted);

      const { data: settings } = await supabase.from('app_settings').select('value').eq('key', 'quiz_paused').maybeSingle();
      if (settings && settings.value === 'true') {
        quizPaused = true;
        document.getElementById('startQuizBtn').disabled = true;
        document.getElementById('startQuizBtn').innerText = 'কুইজ বর্তমানে বন্ধ';
        document.getElementById('quizStatus').innerText = 'অ্যাডমিন কুইজ পজ করেছেন';
      }
    }

    async function startQuiz() {
      if (quizPaused) {
        showToast('কুইজ বর্তমানে বন্ধ আছে', 'warning');
        return;
      }

      const twoHoursAgo = new Date(Date.now() - 2 * 60 * 60 * 1000).toISOString();
      const { data: recent } = await supabase
        .from('quiz_submissions')
        .select('id')
        .eq('user_id', profile.id)
        .gte('submitted_at', twoHoursAgo);

      if (recent && recent.length >= 8) {
        showToast('২ ঘণ্টায় সর্বোচ্চ ৮টি কুইজ দেওয়া যাবে', 'warning');
        return;
      }

      window.location.href = 'quiz.html';
    }

    init();
  </script>
</body>
</html>
