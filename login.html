<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>লগইন - NnowQuiz</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-box">
      <div class="auth-logo">NnowQuiz</div>
      <p class="auth-subtitle">মজার কুইজ খেলে জ্ঞান বাড়াও</p>

      <form id="loginForm">
        <div class="form-group">
          <label>ইমেইল</label>
          <input type="email" id="email" class="form-control" placeholder="আপনার ইমেইল" required>
        </div>
        <div class="form-group">
          <label>পাসওয়ার্ড</label>
          <input type="password" id="password" class="form-control" placeholder="পাসওয়ার্ড" required>
        </div>
        <button type="submit" class="btn btn-primary" id="loginBtn">লগইন করুন</button>
      </form>

      <div class="auth-footer">
        অ্যাকাউন্ট নেই? <a href="register.html">রেজিস্টার করুন</a>
      </div>
    </div>
  </div>

  <script>
    (async () => {
      const user = await getCurrentUser();
      if (user) window.location.href = 'home.html';
    })();

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.innerText = 'লগইন হচ্ছে...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const { data, error } = await sb.auth.signInWithPassword({ email, password });

        if (error) {
          showToast(error.message || 'লগইন ব্যর্থ', 'error');
          btn.disabled = false;
          btn.innerText = 'লগইন করুন';
          return;
        }

        showToast('সফলভাবে লগইন হয়েছে!');
        setTimeout(() => window.location.href = 'home.html', 800);
      } catch (err) {
        showToast('সমস্যা হয়েছে: ' + err.message, 'error');
        btn.disabled = false;
        btn.innerText = 'লগইন করুন';
      }
    });
  </script>
</body>
</html>
