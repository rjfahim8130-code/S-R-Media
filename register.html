<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>রেজিস্টার - QuickQuiz</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container" style="padding-top:30px">
    <div class="hero">
      <h1 style="font-size:1.8rem">রেজিস্টার</h1>
      <p>নতুন অ্যাকাউন্ট তৈরি করুন</p>
    </div>

    <div class="card">
      <div id="error" class="error" style="display:none"></div>
      <div id="success" class="success" style="display:none">স্বাগতম! অ্যাকাউন্ট তৈরি হয়েছে...</div>
      <form id="regForm">
        <label>আপনার নাম</label>
        <input type="text" id="fullName" class="input" required placeholder="আপনার নাম">
        <label>ইমেইল</label>
        <input type="email" id="email" class="input" required placeholder="you@email.com">
        <label>পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)</label>
        <input type="password" id="password" class="input" required minlength="6" placeholder="••••••••">
        <label>রেফারেল কোড (ঐচ্ছিক)</label>
        <input type="text" id="refCode" class="input" placeholder="যদি কেউ রেফার করে থাকে">
        <button type="submit" class="btn btn-primary" id="btn">অ্যাকাউন্ট তৈরি করুন</button>
      </form>
    </div>
    <p class="center text-sm">ইতিমধ্যে অ্যাকাউন্ট আছে? <a href="login.html" style="color:#34d399">লগইন করুন</a></p>
  </div>

  <script src="config.js"></script>
  <script src="supabase.js"></script>
  <script>
    document.getElementById('regForm').onsubmit = async (e) => {
      e.preventDefault()
      const btn = document.getElementById('btn')
      const err = document.getElementById('error')
      btn.disabled = true
      btn.textContent = 'তৈরি হচ্ছে...'
      err.style.display = 'none'

      const fullName = document.getElementById('fullName').value
      const email = document.getElementById('email').value
      const password = document.getElementById('password').value
      const refCode = document.getElementById('refCode').value.trim().toUpperCase()

      const { data, error } = await sb.auth.signUp({
        email, password,
        options: { data: { full_name: fullName } }
      })

      if (error) {
        err.textContent = error.message
        err.style.display = 'block'
        btn.disabled = false
        btn.textContent = 'অ্যাকাউন্ট তৈরি করুন'
        return
      }

      // Handle referral
      if (refCode && data.user) {
        const { data: referrer } = await sb.from('profiles').select('id').eq('referral_code', refCode).single()
        if (referrer) {
          await sb.from('referrals').insert({
            referrer_id: referrer.id,
            referred_id: data.user.id,
            is_successful: false
          })
          await sb.from('profiles').update({ referred_by: referrer.id }).eq('id', data.user.id)
        }
      }

      document.getElementById('success').style.display = 'block'
      setTimeout(() => location.href = 'dashboard.html', 1500)
    }
  </script>
</body>
</html>
