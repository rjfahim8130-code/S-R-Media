<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>লিডারবোর্ড - NnowQuiz</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
</head>
<body>
  <div class="container page">
    <div class="header">
      <button class="back-btn" onclick="location.href='home.html'">←</button>
      <div class="logo">লিডারবোর্ড</div>
      <div style="width:40px;"></div>
    </div>

    <div class="card" style="background:linear-gradient(135deg,#312e81,#1e1b4b);text-align:center;">
      <div style="font-size:2rem;">🏆</div>
      <h2 style="margin:8px 0 4px;">টপ পারফর্মার</h2>
      <p class="text-muted">পয়েন্ট অনুযায়ী র‍্যাঙ্কিং</p>
    </div>

    <div id="leaderboardList">
      <div class="loading"><div class="spinner"></div><p>লিডারবোর্ড লোড হচ্ছে...</p></div>
    </div>
  </div>

  <div class="bottom-nav">
    <a href="home.html" class="nav-item"><span class="icon">🏠</span><span>হোম</span></a>
    <a href="articles.html" class="nav-item"><span class="icon">📚</span><span>প্রবন্ধ</span></a>
    <a href="leaderboard.html" class="nav-item active"><span class="icon">🏆</span><span>র‍্যাঙ্ক</span></a>
    <a href="profile.html" class="nav-item"><span class="icon">👤</span><span>প্রোফাইল</span></a>
  </div>

  <script>
    async function loadLeaderboard() {
      const { data, error } = await sb
        .from('profiles')
        .select('full_name, coins, total_quizzes_submitted')
        .order('coins', { ascending: false })
        .limit(50);

      const container = document.getElementById('leaderboardList');

      if (error || !data || data.length === 0) {
        container.innerHTML = '<p class="text-muted text-center mt-4">এখনো কোনো ডাটা নেই</p>';
        return;
      }

      container.innerHTML = data.map((u, i) => `
        <div class="card" style="display:flex;align-items:center;gap:14px;padding:14px 16px;">
          <div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#c084fc);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:0.95rem;">
            ${i + 1}
          </div>
          <div style="flex:1;">
            <div style="font-weight:600;">${u.full_name || 'ইউজার'}</div>
            <div class="text-muted" style="font-size:0.8rem;">${u.total_quizzes_submitted || 0} কুইজ</div>
          </div>
          <div style="font-weight:700;color:var(--primary);">${formatNumber(u.coins || 0)}</div>
        </div>
      `).join('');
    }

    loadLeaderboard();
  </script>
</body>
</html>
