<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - QuickQuiz</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container">
    <div class="flex-between" style="margin-bottom:16px">
      <h1 style="color:#fbbf24;font-size:1.5rem">Admin Panel</h1>
      <button onclick="location.href='dashboard.html'" class="text-sm" style="background:none;border:none;color:#94a3b8;cursor:pointer">← ড্যাশবোর্ড</button>
    </div>

    <div id="msg" class="success" style="display:none"></div>

    <div class="card">
      <h3 style="margin-bottom:12px">সেটিংস</h3>
      <form id="settingsForm">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <div>
            <label>মিনিমাম রিডিম পয়েন্ট</label>
            <input type="number" id="min_points" class="input">
          </div>
          <div>
            <label>মিনিমাম রেফার</label>
            <input type="number" id="min_ref" class="input">
          </div>
          <div>
            <label>প্রতি কুইজে পয়েন্ট</label>
            <input type="number" id="points_quiz" class="input">
          </div>
          <div>
            <label>দৈনিক ম্যাক্স সেশন</label>
            <input type="number" id="max_sessions" class="input">
          </div>
          <div>
            <label>লক মিনিট</label>
            <input type="number" id="lock" class="input">
          </div>
        </div>
        <button type="submit" class="btn btn-primary mt-2">সেটিংস সেভ করুন</button>
      </form>
    </div>

    <div class="card">
      <h3 style="margin-bottom:12px">পেন্ডিং রিডিম (<span id="reqCount">0</span>)</h3>
      <div id="reqList"></div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="supabase.js"></script>
  <script>
    async function init() {
      const user = await getUser()
      if (!user) return location.href = 'login.html'
      const profile = await getProfile(user.id)
      if (!profile?.is_admin) {
        alert('অ্যাডমিন অ্যাক্সেস নেই')
        location.href = 'dashboard.html'
        return
      }

      const settings = await getSettings()
      document.getElementById('min_points').value = settings.min_redeem_points
      document.getElementById('min_ref').value = settings.min_referrals_for_redeem
      document.getElementById('points_quiz').value = settings.points_per_quiz
      document.getElementById('max_sessions').value = settings.daily_max_sessions
      document.getElementById('lock').value = settings.lock_minutes

      // Pending requests
      const { data: reqs } = await sb.from('redeem_requests')
        .select('*, profiles(full_name, email)')
        .eq('status', 'pending')
        .order('created_at')

      document.getElementById('reqCount').textContent = reqs?.length || 0
      const list = document.getElementById('reqList')
      if (!reqs || !reqs.length) {
        list.innerHTML = '<p class="text-sm">কোনো পেন্ডিং রিকোয়েস্ট নেই</p>'
        return
      }
      list.innerHTML = reqs.map(r => `
        <div class="card" style="padding:12px;margin-bottom:10px;border:1px solid #475569">
          <div class="flex-between">
            <strong>${r.profiles?.full_name || 'Unknown'}</strong>
            <span>${r.points} পয়েন্ট</span>
          </div>
          <p class="text-sm mt-2">${r.payment_method}: ${r.payment_number}</p>
          <div style="display:flex;gap:8px;margin-top:10px">
            <button onclick="process(${r.id},'approved')" class="btn btn-primary" style="padding:8px;margin:0">Approve</button>
            <button onclick="process(${r.id},'rejected')" class="btn btn-secondary" style="padding:8px;margin:0">Reject</button>
          </div>
        </div>
      `).join('')
    }

    document.getElementById('settingsForm').onsubmit = async (e) => {
      e.preventDefault()
      await sb.from('site_settings').update({
        min_redeem_points: +document.getElementById('min_points').value,
        min_referrals_for_redeem: +document.getElementById('min_ref').value,
        points_per_quiz: +document.getElementById('points_quiz').value,
        daily_max_sessions: +document.getElementById('max_sessions').value,
        lock_minutes: +document.getElementById('lock').value,
        updated_at: new Date().toISOString()
      }).eq('id', 1)
      showMsg('সেটিংস আপডেট হয়েছে')
    }

    async function process(id, status) {
      await sb.from('redeem_requests').update({
        status,
        processed_at: new Date().toISOString()
      }).eq('id', id)
      showMsg('রিকোয়েস্ট ' + status + ' করা হয়েছে')
      setTimeout(() => location.reload(), 800)
    }

    function showMsg(t) {
      const el = document.getElementById('msg')
      el.textContent = t
      el.style.display = 'block'
      setTimeout(() => el.style.display = 'none', 2500)
    }

    init()
  </script>
</body>
</html>
