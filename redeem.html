<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>রিডিম - QuickQuiz</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container">
    <button onclick="location.href='dashboard.html'" class="text-sm" style="background:none;border:none;color:#94a3b8;margin-bottom:12px;cursor:pointer">← ড্যাশবোর্ড</button>
    <h1 style="color:#34d399;margin-bottom:20px">রিডিম</h1>

    <div class="card center">
      <p class="text-sm">বর্তমান পয়েন্ট</p>
      <div class="points-big" id="points">0</div>
      <p class="text-sm mt-2" id="reqText"></p>
    </div>

    <div id="formArea" class="card" style="display:none">
      <form id="redeemForm">
        <label>পেমেন্ট মেথড</label>
        <select id="method" class="input">
          <option>bKash</option>
          <option>Nagad</option>
          <option>Rocket</option>
        </select>
        <label>নম্বর</label>
        <input type="text" id="number" class="input" required placeholder="01XXXXXXXXX">
        <button type="submit" class="btn btn-primary" id="btn">রিডিম রিকোয়েস্ট পাঠান</button>
      </form>
    </div>

    <div id="notEligible" class="card center text-sm" style="display:none">
      এখনও রিডিম করার যোগ্যতা পূরণ হয়নি
    </div>

    <div id="msg" class="success" style="display:none"></div>

    <div id="history" class="mt-4"></div>
  </div>

  <script src="config.js"></script>
  <script src="supabase.js"></script>
  <script>
    let profile, settings

    async function init() {
      const user = await getUser()
      if (!user) return location.href = 'login.html'
      profile = await getProfile(user.id)
      settings = await getSettings()

      document.getElementById('points').textContent = profile.points || 0
      document.getElementById('reqText').textContent = 
        `প্রয়োজন: ${settings.min_redeem_points} পয়েন্ট + ${settings.min_referrals_for_redeem} সফল রেফার`

      const can = (profile.points >= settings.min_redeem_points) && 
                  (profile.successful_referrals >= settings.min_referrals_for_redeem)

      if (can) document.getElementById('formArea').style.display = 'block'
      else document.getElementById('notEligible').style.display = 'block'

      // History
      const { data: reqs } = await sb.from('redeem_requests')
        .select('*').eq('user_id', user.id).order('created_at', { ascending: false }).limit(5)
      
      if (reqs && reqs.length) {
        let html = '<h3 style="margin-bottom:10px">আগের রিকোয়েস্ট</h3>'
        reqs.forEach(r => {
          const cls = r.status === 'approved' ? 'badge-approved' : r.status === 'rejected' ? 'badge-rejected' : 'badge-pending'
          html += `<div class="card flex-between" style="padding:12px;margin-bottom:8px">
            <span>${r.points} পয়েন্ট • ${r.payment_method}</span>
            <span class="badge ${cls}">${r.status}</span>
          </div>`
        })
        document.getElementById('history').innerHTML = html
      }
    }

    document.getElementById('redeemForm').onsubmit = async (e) => {
      e.preventDefault()
      const btn = document.getElementById('btn')
      btn.disabled = true
      btn.textContent = 'পাঠানো হচ্ছে...'

      await sb.from('redeem_requests').insert({
        user_id: profile.id,
        points: profile.points,
        payment_method: document.getElementById('method').value,
        payment_number: document.getElementById('number').value,
        status: 'pending'
      })

      await sb.from('profiles').update({ points: 0 }).eq('id', profile.id)

      document.getElementById('msg').textContent = 'রিডিম রিকোয়েস্ট পাঠানো হয়েছে! অ্যাডমিন পর্যালোচনা করবে।'
      document.getElementById('msg').style.display = 'block'
      document.getElementById('formArea').style.display = 'none'
      setTimeout(() => location.reload(), 2000)
    }

    init()
  </script>
</body>
</html>
