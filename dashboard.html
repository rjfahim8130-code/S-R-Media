<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ড্যাশবোর্ড - QuickQuiz</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container">
    <div class="flex-between" style="margin-bottom:20px">
      <div>
        <h2 id="userName">হাই 👋</h2>
        <p class="text-sm" id="userEmail"></p>
      </div>
      <button onclick="logout()" class="text-sm" style="background:none;border:none;color:#f87171;cursor:pointer">লগআউট</button>
    </div>

    <div class="card center">
      <p class="text-sm">আপনার পয়েন্ট</p>
      <div class="points-big" id="points">0</div>
      <p class="text-sm mt-2">সফল রেফার: <span id="refs">0</span></p>
    </div>

    <div class="card flex-between">
      <div>
        <p class="text-sm">আজকের সেশন</p>
        <p style="font-weight:700"><span id="todaySessions">0</span> / <span id="maxSessions">5</span></p>
      </div>
      <button onclick="startQuiz()" class="btn btn-primary" style="width:auto;padding:12px 20px;margin:0">কুইজ শুরু</button>
    </div>

    <div id="msg" class="success" style="display:none"></div>

    <div class="card">
      <p class="text-sm" style="margin-bottom:6px">আপনার রেফারেল কোড</p>
      <div class="flex-between">
        <input id="refCode" class="input" readonly style="margin:0;text-align:center;font-family:monospace;font-size:18px;letter-spacing:1px">
        <button onclick="copyCode()" class="btn btn-secondary" style="width:auto;padding:12px 16px;margin:0 0 0 8px">কপি</button>
      </div>
      <p class="text-sm mt-2">বন্ধুদের রেফার করুন। তারা কুইজ খেললে আপনি বোনাস পাবেন!</p>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <button onclick="location.href='redeem.html'" class="btn btn-secondary">রিডিম করুন</button>
      <button onclick="location.reload()" class="btn btn-secondary">রিফ্রেশ</button>
    </div>

    <p id="adminLink" class="center mt-4" style="display:none">
      <a href="admin.html" style="color:#fbbf24;font-size:14px">🔧 Admin Panel</a>
    </p>
  </div>

  <script src="config.js"></script>
  <script src="supabase.js"></script>
  <script>
    let profile = null, settings = null

    async function init() {
      const user = await getUser()
      if (!user) return location.href = 'login.html'

      profile = await getProfile(user.id)
      settings = await getSettings()

      document.getElementById('userName').textContent = 'হাই, ' + (profile.full_name || 'User') + ' 👋'
      document.getElementById('userEmail').textContent = profile.email || ''
      document.getElementById('points').textContent = profile.points || 0
      document.getElementById('refs').textContent = profile.successful_referrals || 0
      document.getElementById('refCode').value = profile.referral_code || ''
      document.getElementById('maxSessions').textContent = settings?.daily_max_sessions || 5

      if (profile.is_admin) document.getElementById('adminLink').style.display = 'block'

      // Today sessions
      const today = new Date().toISOString().split('T')[0]
      const { count } = await sb.from('user_sessions').select('*', { count: 'exact', head: true })
        .eq('user_id', user.id).eq('session_date', today)
      document.getElementById('todaySessions').textContent = count || 0
      window.todayCount = count || 0
    }

    function startQuiz() {
      const max = settings?.daily_max_sessions || 5
      if (window.todayCount >= max) {
        showMsg('আজকের সেশন শেষ! কাল আবার আসুন 😊')
        return
      }
      location.href = 'quiz.html'
    }

    function copyCode() {
      navigator.clipboard.writeText(document.getElementById('refCode').value)
      showMsg('কোড কপি হয়েছে! 🎉')
    }

    function showMsg(t) {
      const el = document.getElementById('msg')
      el.textContent = t
      el.style.display = 'block'
      setTimeout(() => el.style.display = 'none', 2500)
    }

    async function logout() {
      await sb.auth.signOut()
      location.href = 'index.html'
    }

    init()
  </script>
</body>
</html>
