<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>কুইজ - NnowQuiz</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
</head>
<body>
  <div class="container page">
    <div class="header">
      <button class="back-btn" onclick="if(confirm('কুইজ ছেড়ে যেতে চান?')) location.href='home.html'">←</button>
      <div class="logo">কুইজ</div>
      <div id="quizProgress" class="badge badge-primary">১/৫</div>
    </div>

    <div class="progress-bar" style="height:8px;background:var(--dark-3);border-radius:20px;overflow:hidden;margin-bottom:16px;">
      <div class="progress-fill" id="progressFill" style="height:100%;width:20%;background:linear-gradient(90deg,#6366f1,#c084fc);border-radius:20px;"></div>
    </div>

    <div id="articleSection">
      <div class="card">
        <div class="card-title" id="articleTitle">প্রবন্ধ লোড হচ্ছে...</div>
        <div id="articleContent" style="max-height:300px;overflow-y:auto;line-height:1.7;"></div>
      </div>
      <button class="btn btn-primary" id="startQuestionsBtn">প্রশ্নোত্তর শুরু করুন</button>
    </div>

    <div id="questionsSection" style="display:none;">
      <div class="card">
        <div id="questionNumber" style="font-size:0.85rem;color:var(--primary-light);font-weight:600;margin-bottom:8px;">প্রশ্ন ১</div>
        <div id="questionText" style="font-size:1.1rem;font-weight:600;margin-bottom:20px;"></div>
        <div id="optionsContainer"></div>
      </div>
      <button class="btn btn-primary" id="nextBtn" disabled>পরবর্তী প্রশ্ন</button>
      <button class="btn btn-secondary mt-2" id="showArticleBtn">প্রবন্ধ আবার পড়ুন</button>
    </div>
  </div>

  <script>
    let profile = null, currentArticle = null, questions = [], currentQ = 0, answers = {}, setNumber = 1;

    async function init() {
      const user = await requireAuth();
      if (!user) return;
      profile = await getProfile();

      const { data: pause } = await sb.from('app_settings').select('value').eq('key', 'quiz_paused').maybeSingle();
      if (pause?.value === 'true') {
        showToast('কুইজ বর্তমানে বন্ধ', 'error');
        setTimeout(() => location.href = 'home.html', 1500);
        return;
      }

      const { data: articles } = await sb.from('articles').select('*').eq('is_active', true).order('sort_order');
      if (!articles?.length) {
        document.getElementById('articleSection').innerHTML = '<div class="empty-state"><p>কোনো প্রবন্ধ নেই</p></div>';
        return;
      }

      const { data: subs } = await sb.from('quiz_submissions').select('id').eq('user_id', profile.id);
      const total = subs?.length || 0;
      currentArticle = articles[total % articles.length];
      setNumber = (Math.floor(total / articles.length) % 3) + 1;

      const { data: qs } = await sb.from('questions').select('*').eq('article_id', currentArticle.id).eq('set_number', setNumber).limit(5);
      questions = qs || [];

      if (!questions.length) {
        document.getElementById('articleSection').innerHTML = '<div class="empty-state"><p>প্রশ্ন নেই</p></div>';
        return;
      }

      document.getElementById('articleTitle').innerText = currentArticle.title;
      document.getElementById('articleContent').innerHTML = currentArticle.content.split('\n').filter(p => p.trim()).map(p => `<p style="margin-bottom:12px;">${p}</p>`).join('');
    }

    document.getElementById('startQuestionsBtn').onclick = () => {
      document.getElementById('articleSection').style.display = 'none';
      document.getElementById('questionsSection').style.display = 'block';
      currentQ = 0;
      answers = {};
      showQ();
    };

    document.getElementById('showArticleBtn').onclick = () => {
      document.getElementById('questionsSection').style.display = 'none';
      document.getElementById('articleSection').style.display = 'block';
    };

    function showQ() {
      const q = questions[currentQ];
      document.getElementById('questionNumber').innerText = `প্রশ্ন ${currentQ + 1} / ${questions.length}`;
      document.getElementById('questionText').innerText = q.question_text;
      document.getElementById('quizProgress').innerText = `\( {currentQ + 1}/ \){questions.length}`;
      document.getElementById('progressFill').style.width = `${((currentQ + 1) / questions.length) * 100}%`;

      const opts = [
        {k:'A', t:q.option_a}, {k:'B', t:q.option_b},
        {k:'C', t:q.option_c}, {k:'D', t:q.option_d}
      ];

      document.getElementById('optionsContainer').innerHTML = opts.map(o => `
        <div class="option \( {answers[currentQ]===o.k?'selected':''}" onclick="selectOpt(' \){o.k}')" style="display:flex;gap:12px;align-items:center;padding:14px;background:var(--dark);border:2px solid var(--dark-3);border-radius:12px;margin-bottom:10px;cursor:pointer;">
          <div style="width:32px;height:32px;border-radius:50%;background:var(--dark-3);display:flex;align-items:center;justify-content:center;font-weight:700;">${o.k}</div>
          <div>${o.t}</div>
        </div>
      `).join('');

      const btn = document.getElementById('nextBtn');
      btn.innerText = currentQ === questions.length - 1 ? 'কুইজ জমা দিন' : 'পরবর্তী প্রশ্ন';
      btn.disabled = !answers[currentQ];
    }

    window.selectOpt = (k) => {
      answers[currentQ] = k;
      showQ();
    };

    document.getElementById('nextBtn').onclick = async () => {
      if (!answers[currentQ]) return;
      if (currentQ < questions.length - 1) {
        currentQ++;
        showQ();
      } else {
        let correct = 0;
        questions.forEach((q,i) => { if (answers[i] === q.correct_option) correct++; });
        const coins = correct * 10;

        await sb.from('quiz_submissions').insert({
          user_id: profile.id,
          article_id: currentArticle.id,
          set_number: setNumber,
          score: correct,
          coins_earned: coins
        });

        await sb.from('profiles').update({
          coins: (profile.coins || 0) + coins,
          total_quizzes_submitted: (profile.total_quizzes_submitted || 0) + 1,
          last_quiz_at: new Date().toISOString()
        }).eq('id', profile.id);

        if (profile.referred_by && coins > 0) {
          const bonus = Math.floor(coins * 0.1);
          if (bonus > 0) {
            await sb.from('referral_bonuses').insert({
              referrer_id: profile.referred_by,
              referred_user_id: profile.id,
              bonus_amount: bonus,
              expires_at: new Date(Date.now() + 12*60*60*1000).toISOString()
            });
          }
        }

        sessionStorage.setItem('quizResult', JSON.stringify({
          correct, total: questions.length, coins, articleTitle: currentArticle.title
        }));
        location.href = 'result.html';
      }
    };

    init();
  </script>
</body>
</html>
