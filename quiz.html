<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>কুইজ - NnowQuiz</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container page">
    <div class="header">
      <button class="back-btn" onclick="confirmExit()">←</button>
      <div class="logo">কুইজ</div>
      <div id="quizProgress" class="badge badge-primary">১/৫</div>
    </div>

    <div class="progress-bar">
      <div class="progress-fill" id="progressFill" style="width:20%;"></div>
    </div>

    <div id="articleSection">
      <div class="card">
        <div class="card-title" id="articleTitle">প্রবন্ধ লোড হচ্ছে...</div>
        <div class="article-content" id="articleContent" style="max-height:320px;overflow-y:auto;"></div>
      </div>
      <button class="btn btn-primary" id="startQuestionsBtn" onclick="startQuestions()">প্রশ্নোত্তর শুরু করুন</button>
      <p class="text-muted text-center mt-2" style="font-size:0.85rem;">প্রবন্ধ ভালো করে পড়ুন</p>
    </div>

    <div id="questionsSection" style="display:none;">
      <div class="question-card">
        <div class="question-number" id="questionNumber">প্রশ্ন ১</div>
        <div class="question-text" id="questionText"></div>
        <div id="optionsContainer"></div>
      </div>
      <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" disabled>পরবর্তী প্রশ্ন</button>
      <button class="btn btn-secondary mt-2" onclick="showArticleAgain()">প্রবন্ধ আবার পড়ুন</button>
    </div>
  </div>

  <script src="supabase.js"></script>
  <script>
    let profile = null, currentArticle = null, questions = [], currentQuestionIndex = 0, selectedAnswers = {}, currentSetNumber = 1;

    async function init() {
      const user = await requireAuth();
      if (!user) return;
      profile = await getProfile();

      const { data: pause } = await supabase.from('app_settings').select('value').eq('key', 'quiz_paused').maybeSingle();
      if (pause && pause.value === 'true') {
        showToast('কুইজ বর্তমানে বন্ধ', 'warning');
        setTimeout(() => location.href = 'home.html', 1500);
        return;
      }

      await loadQuizData();
    }

    async function loadQuizData() {
      const { data: articles } = await supabase.from('articles').select('*').eq('is_active', true).order('sort_order');
      if (!articles || articles.length === 0) {
        document.getElementById('articleSection').innerHTML = `<div class="empty-state"><p>কোনো প্রবন্ধ নেই</p><a href="home.html" class="btn btn-primary mt-3">হোমে যান</a></div>`;
        return;
      }

      const { data: submissions } = await supabase.from('quiz_submissions').select('id').eq('user_id', profile.id);
      const totalSubmitted = submissions ? submissions.length : 0;
      const articleIndex = totalSubmitted % articles.length;
      currentSetNumber = (Math.floor(totalSubmitted / articles.length) % 3) + 1;
      currentArticle = articles[articleIndex];

      const { data: qs } = await supabase.from('questions').select('*').eq('article_id', currentArticle.id).eq('set_number', currentSetNumber).limit(5);
      questions = qs && qs.length > 0 ? qs : [];

      if (questions.length === 0) {
        document.getElementById('articleSection').innerHTML = `<div class="empty-state"><p>এই প্রবন্ধের প্রশ্ন নেই</p><a href="home.html" class="btn btn-primary mt-3">হোমে যান</a></div>`;
        return;
      }

      document.getElementById('articleTitle').innerText = currentArticle.title;
      document.getElementById('articleContent').innerHTML = currentArticle.content.split('\n').map(p => p.trim() ? `<p>${p}</p>` : '').join('');
    }

    function startQuestions() {
      document.getElementById('articleSection').style.display = 'none';
      document.getElementById('questionsSection').style.display = 'block';
      currentQuestionIndex = 0;
      selectedAnswers = {};
      showQuestion();
    }

    function showQuestion() {
      const q = questions[currentQuestionIndex];
      document.getElementById('questionNumber').innerText = `প্রশ্ন ${currentQuestionIndex + 1} / ${questions.length}`;
      document.getElementById('questionText').innerText = q.question_text;
      document.getElementById('quizProgress').innerText = `\( {currentQuestionIndex + 1}/ \){questions.length}`;
      document.getElementById('progressFill').style.width = `${((currentQuestionIndex + 1) / questions.length) * 100}%`;

      const options = [
        { key: 'A', text: q.option_a },
        { key: 'B', text: q.option_b },
        { key: 'C', text: q.option_c },
        { key: 'D', text: q.option_d }
      ];

      document.getElementById('optionsContainer').innerHTML = options.map(opt => `
        <div class="option \( {selectedAnswers[currentQuestionIndex] === opt.key ? 'selected' : ''}" onclick="selectOption(' \){opt.key}')">
          <div class="option-letter">${opt.key}</div>
          <div>${opt.text}</div>
        </div>
      `).join('');

      const nextBtn = document.getElementById('nextBtn');
      nextBtn.innerText = currentQuestionIndex === questions.length - 1 ? 'কুইজ জমা দিন' : 'পরবর্তী প্রশ্ন';
      nextBtn.disabled = !selectedAnswers[currentQuestionIndex];
    }

    function selectOption(key) {
      selectedAnswers[currentQuestionIndex] = key;
      showQuestion();
    }

    function nextQuestion() {
      if (!selectedAnswers[currentQuestionIndex]) return;
      if (currentQuestionIndex < questions.length - 1) {
        currentQuestionIndex++;
        showQuestion();
      } else {
        submitQuiz();
      }
    }

    async function submitQuiz() {
      let correctCount = 0;
      questions.forEach((q, i) => {
        if (selectedAnswers[i] === q.correct_option) correctCount++;
      });
      const coinsEarned = correctCount * 10;

      await supabase.from('quiz_submissions').insert({
        user_id: profile.id,
        article_id: currentArticle.id,
        set_number: currentSetNumber,
        score: correctCount,
        coins_earned: coinsEarned
      });

      await supabase.from('profiles').update({
        coins: (profile.coins || 0) + coinsEarned,
        total_quizzes_submitted: (profile.total_quizzes_submitted || 0) + 1,
        last_quiz_at: new Date().toISOString()
      }).eq('id', profile.id);

      // Referral bonus 10%
      if (profile.referred_by && coinsEarned > 0) {
        const bonus = Math.floor(coinsEarned * 0.1);
        if (bonus > 0) {
          await supabase.from('referral_bonuses').insert({
            referrer_id: profile.referred_by,
            referred_user_id: profile.id,
            bonus_amount: bonus,
            expires_at: new Date(Date.now() + 12 * 60 * 60 * 1000).toISOString()
          });
        }
      }

      sessionStorage.setItem('quizResult', JSON.stringify({
        correct: correctCount,
        total: questions.length,
        coins: coinsEarned,
        articleTitle: currentArticle.title
      }));
      window.location.href = 'result.html';
    }

    function showArticleAgain() {
      document.getElementById('questionsSection').style.display = 'none';
      document.getElementById('articleSection').style.display = 'block';
    }

    function confirmExit() {
      if (confirm('কুইজ ছেড়ে যেতে চান?')) location.href = 'home.html';
    }

    init();
  </script>
</body>
</html>
