<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>কুইজ - NnowQuiz</title>
  
  <meta name="monetag" content="5d5bd8350ba1e36f1af8d3b4b95c4595">
  <meta name="8645434d5e68c17799df1ccb083d05cc97221a9c" content="8645434d5e68c17799df1ccb083d05cc97221a9c" />
  <meta name="clckd" content="85de58977d8432e90f4c1b625a374f3d" />

  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="ads.js"></script>

  <style>
    .timer-box {
      background: linear-gradient(135deg, #312e81, #1e1b4b);
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      margin-bottom: 16px;
    }
    .timer-number {
      font-size: 2.8rem;
      font-weight: 800;
      color: #a5b4fc;
    }
    .motivate-text {
      font-size: 1rem;
      margin-top: 8px;
      color: #c7d2fe;
    }
    .question-card {
      background: var(--dark-2);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
    }
    .option-btn {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 12px 14px;
      background: var(--dark);
      border: 2px solid var(--dark-3);
      border-radius: 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: 0.2s;
    }
    .option-btn.selected {
      border-color: var(--primary);
      background: rgba(99,102,241,0.15);
    }
    .option-label {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--dark-3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.9rem;
      flex-shrink: 0;
    }
    .verify-item {
      background: var(--dark-2);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      text-align: center;
    }
    .ad-box {
      min-height: 90px;
      margin: 16px 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>
<body>
  <div class="container page">
    <div class="header">
      <button class="back-btn" onclick="if(confirm('কুইজ ছেড়ে যেতে চান?')) location.href='home.html'">←</button>
      <div class="logo">কুইজ</div>
      <div id="quizProgress" class="badge badge-primary">০/৫</div>
    </div>

    <!-- ===== প্রবন্ধ সেকশন ===== -->
    <div id="articleSection">
      <div class="timer-box" id="articleTimerBox">
        <div class="timer-number" id="articleTimer">৭৫</div>
        <div class="motivate-text" id="articleMotivate">বইয়ের মতো করে পড়ুন 📖 মনোযোগ দিলেই পয়েন্ট বেশি পাবেন!</div>
      </div>

      <div class="card">
        <div class="card-title" id="articleTitle">প্রবন্ধ লোড হচ্ছে...</div>
        <div id="articleContent" style="line-height:1.75;font-size:0.98rem;white-space:pre-line;"></div>
      </div>

      <div class="ad-box" id="articleNativeAd"></div>

      <button class="btn btn-primary" id="startQuestionsBtn" disabled>প্রশ্নোত্তরে যান (অপেক্ষা করুন)</button>
    </div>

    <!-- ===== প্রশ্ন সেকশন ===== -->
    <div id="questionsSection" style="display:none;">
      <div class="timer-box" id="questionTimerBox">
        <div class="timer-number" id="questionTimer">৫০</div>
        <div class="motivate-text">মনোযোগ দিয়ে উত্তর দিন 💪 প্রতিটি সঠিক উত্তরে ১০ পয়েন্ট!</div>
      </div>

      <div id="allQuestions"></div>

      <div class="ad-box" id="questionNativeAd"></div>

      <button class="btn btn-primary" id="submitBtn" disabled>কুইজ জমা দিন</button>
      <button class="btn btn-secondary mt-2" id="showArticleBtn">প্রবন্ধ আবার পড়ুন</button>
    </div>

    <!-- ===== রেজাল্ট ভেরিফিকেশন ===== -->
    <div id="verifySection" style="display:none;">
      <div class="card">
        <h2 style="text-align:center;margin-bottom:16px;">উত্তর যাচাই করা হচ্ছে...</h2>
        <div id="verifyList"></div>
      </div>
      <div class="ad-box" id="resultBannerAd"></div>
    </div>

    <!-- ===== ফাইনাল রেজাল্ট ===== -->
    <div id="resultSection" style="display:none;text-align:center;">
      <div class="card" style="padding:30px 20px;">
        <div style="font-size:3.5rem;margin-bottom:12px;" id="resultEmoji">🎉</div>
        <h2 id="resultTitle" style="margin-bottom:8px;">দারুণ!</h2>
        <p class="text-muted mb-3" id="resultText"></p>
        <div style="font-size:2rem;font-weight:800;color:var(--primary);margin-bottom:20px;" id="coinsEarned"></div>
        <button class="btn btn-primary" onclick="location.href='home.html'">হোমে যান</button>
      </div>
    </div>
  </div>

  <script>
    let profile = null;
    let currentArticle = null;
    let questions = [];
    let answers = {};
    let articleTimerInterval = null;
    let questionTimerInterval = null;
    let canStartQuestions = false;
    let canSubmit = false;

    const ARTICLE_TIME = 75;   // সেকেন্ড
    const QUESTION_TIME = 50;  // সেকেন্ড

    async function init() {
      const user = await requireAuth();
      if (!user) return;
      profile = await getProfile();
      if (!profile) return;

      // সেশন লিমিট চেক
      const { data: settings } = await sb.from('app_settings').select('*');
      const settingsMap = {};
      (settings || []).forEach(s => settingsMap[s.key] = s.value);

      if (settingsMap.quiz_paused === 'true') {
        showToast('কুইজ বর্তমানে বন্ধ আছে', 'error');
        setTimeout(() => location.href = 'home.html', 1500);
        return;
      }

      const sessionLimit = parseInt(settingsMap.session_quiz_limit || '8');
      const cooldownMin = parseInt(settingsMap.cooldown_minutes || '80');

      const cooldownAgo = new Date(Date.now() - cooldownMin * 60 * 1000).toISOString();
      const { data: recent } = await sb.from('quiz_submissions')
        .select('id')
        .eq('user_id', profile.id)
        .gte('submitted_at', cooldownAgo);

      if (recent && recent.length >= sessionLimit) {
        showToast(`এই সেশনের ${sessionLimit}টি কুইজ শেষ। ${cooldownMin} মিনিট পর আবার চেষ্টা করুন।`, 'error');
        setTimeout(() => location.href = 'home.html', 2000);
        return;
      }

      await loadArticleAndQuestions();
      startArticleTimer();
      AdManager.showNative('articleNativeAd');
    }

    async function loadArticleAndQuestions() {
      const { data: qData } = await sb.from('questions').select('article_id').not('article_id', 'is', null);
      const articleIds = [...new Set((qData || []).map(q => q.article_id))];

      if (articleIds.length === 0) {
        document.getElementById('articleTitle').innerText = 'কোনো প্রবন্ধ পাওয়া যায়নি';
        return;
      }

      const { count } = await sb.from('quiz_submissions').select('*', { count: 'exact', head: true }).eq('user_id', profile.id);
      const idx = (count || 0) % articleIds.length;
      const selectedId = articleIds[idx];

      const { data: article } = await sb.from('articles').select('*').eq('id', selectedId).single();
      if (!article) {
        document.getElementById('articleTitle').innerText = 'প্রবন্ধ লোড ব্যর্থ';
        return;
      }

      currentArticle = article;
      document.getElementById('articleTitle').innerText = article.title;
      document.getElementById('articleContent').innerText = article.content;

      const { data: qs } = await sb.from('questions')
        .select('*')
        .eq('article_id', selectedId)
        .order('id', { ascending: true })
        .limit(5);

      questions = qs || [];
      if (questions.length === 0) {
        document.getElementById('articleTitle').innerText = 'এই প্রবন্ধে কোনো প্রশ্ন নেই';
      }
    }

    function startArticleTimer() {
      let timeLeft = ARTICLE_TIME;
      document.getElementById('articleTimer').innerText = timeLeft;
      document.getElementById('startQuestionsBtn').disabled = true;
      document.getElementById('startQuestionsBtn').innerText = `প্রশ্নোত্তরে যান (${timeLeft}s)`;

      const motivates = [
        'বইয়ের মতো করে পড়ুন 📖 মনোযোগ দিলেই পয়েন্ট বেশি পাবেন!',
        'প্রতিটি লাইন মনোযোগ দিয়ে পড়ুন ✨',
        'জ্ঞানই শক্তি! ভালো করে পড়ুন 💪',
        'আর একটু সময় দিন, প্রশ্ন সহজ মনে হবে 🌟'
      ];

      articleTimerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById('articleTimer').innerText = timeLeft;
        document.getElementById('startQuestionsBtn').innerText = `প্রশ্নোত্তরে যান (${timeLeft}s)`;

        if (timeLeft % 15 === 0) {
          document.getElementById('articleMotivate').innerText = motivates[Math.floor(Math.random() * motivates.length)];
        }

        if (timeLeft <= 0) {
          clearInterval(articleTimerInterval);
          canStartQuestions = true;
          document.getElementById('startQuestionsBtn').disabled = false;
          document.getElementById('startQuestionsBtn').innerText = 'প্রশ্নোত্তরে যান';
          document.getElementById('articleTimerBox').style.display = 'none';
        }
      }, 1000);
    }

    document.getElementById('startQuestionsBtn').addEventListener('click', () => {
      if (!canStartQuestions) return;
      document.getElementById('articleSection').style.display = 'none';
      document.getElementById('questionsSection').style.display = 'block';
      renderQuestions();
      startQuestionTimer();
      AdManager.showNative('questionNativeAd');
    });

    function startQuestionTimer() {
      let timeLeft = QUESTION_TIME;
      document.getElementById('questionTimer').innerText = timeLeft;
      canSubmit = false;
      document.getElementById('submitBtn').disabled = true;

      questionTimerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById('questionTimer').innerText = timeLeft;

        if (timeLeft <= 0) {
          clearInterval(questionTimerInterval);
          canSubmit = true;
          document.getElementById('questionTimerBox').style.display = 'none';
          updateSubmitButton();
        }
      }, 1000);
    }

    function renderQuestions() {
      const container = document.getElementById('allQuestions');
      container.innerHTML = '';
      const labels = ['ক', 'খ', 'গ', 'ঘ'];

      questions.forEach((q, qIndex) => {
        const opts = Array.isArray(q.options) ? q.options : JSON.parse(q.options || '[]');
        let html = `<div class="question-card">
          <div style="font-weight:700;margin-bottom:12px;">${qIndex + 1}. ${q.question_text}</div>`;

        opts.forEach((opt, oIndex) => {
          html += `<div class="option-btn" data-q="${qIndex}" data-o="${oIndex}">
            <div class="option-label">${labels[oIndex]}</div>
            <div>${opt}</div>
          </div>`;
        });
        html += `</div>`;
        container.innerHTML += html;
      });

      document.querySelectorAll('.option-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const qIdx = btn.dataset.q;
          document.querySelectorAll(`.option-btn[data-q="${qIdx}"]`).forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          answers[qIdx] = parseInt(btn.dataset.o);
          document.getElementById('quizProgress').innerText = Object.keys(answers).length + '/' + questions.length;
          updateSubmitButton();
        });
      });
    }

    function updateSubmitButton() {
      const allAnswered = Object.keys(answers).length >= questions.length;
      document.getElementById('submitBtn').disabled = !(allAnswered && canSubmit);
    }

    document.getElementById('showArticleBtn').addEventListener('click', () => {
      document.getElementById('questionsSection').style.display = 'none';
      document.getElementById('articleSection').style.display = 'block';
      document.getElementById('articleTimerBox').style.display = 'block';
      canStartQuestions = false;
      startArticleTimer();
      AdManager.showNative('articleNativeAd');

      if (Math.random() < 0.35) {
        AdManager.showInterstitial();
      }
    });

    document.getElementById('submitBtn').addEventListener('click', async () => {
      if (!canSubmit || Object.keys(answers).length < questions.length) return;

      document.getElementById('submitBtn').disabled = true;
      document.getElementById('submitBtn').innerText = 'বিজ্ঞাপন দেখুন...';

      await AdManager.showInterstitial();

      document.getElementById('questionsSection').style.display = 'none';
      document.getElementById('verifySection').style.display = 'block';
      AdManager.showBanner('resultBannerAd');

      await runVerification();
    });

    async function runVerification() {
      const list = document.getElementById('verifyList');
      list.innerHTML = '';
      let correctCount = 0;

      for (let i = 0; i < questions.length; i++) {
        const q = questions[i];
        const userAns = answers[i];
        const isCorrect = userAns === q.correct_answer;
        if (isCorrect) correctCount++;

        const div = document.createElement('div');
        div.className = 'verify-item';
        div.innerHTML = `<div style="font-size:1.1rem;margin-bottom:8px;">${i + 1} নং উত্তর যাচাই করা হচ্ছে...</div>
                         <div style="font-size:1.6rem;" id="count${i}">৩</div>`;
        list.appendChild(div);

        for (let c = 3; c >= 1; c--) {
          document.getElementById('count' + i).innerText = c;
          await sleep(700);
        }

        if (isCorrect) {
          div.innerHTML = `<div style="font-size:1.5rem;">🎉 হুররে!</div>
                           <div style="margin-top:6px;">আপনার ${i + 1} নং উত্তর <strong style="color:#4ade80;">সঠিক</strong> হয়েছে</div>
                           <div style="margin-top:4px;color:#a5b4fc;">+১০ পয়েন্ট 😍</div>`;
        } else {
          div.innerHTML = `<div style="font-size:1.5rem;">😅</div>
                           <div style="margin-top:6px;">আপনার ${i + 1} নং উত্তর <strong style="color:#f87171;">ভুল</strong> হয়েছে</div>`;
        }
        await sleep(900);
      }

      const coins = correctCount * 10;
      await sb.from('quiz_submissions').insert({
        user_id: profile.id,
        article_id: currentArticle.id,
        correct_count: correctCount,
        total_questions: questions.length,
        coins_earned: coins
      });

      await sb.from('profiles').update({
        coins: (profile.coins || 0) + coins,
        total_quizzes: (profile.total_quizzes || 0) + 1
      }).eq('id', profile.id);

      await sleep(800);
      document.getElementById('verifySection').style.display = 'none';
      document.getElementById('resultSection').style.display = 'block';

      document.getElementById('resultEmoji').innerText = correctCount >= 4 ? '🏆' : correctCount >= 2 ? '🎉' : '💪';
      document.getElementById('resultTitle').innerText = correctCount >= 4 ? 'অসাধারণ!' : correctCount >= 2 ? 'দারুণ!' : 'আরও চেষ্টা করুন!';
      document.getElementById('resultText').innerText = `${correctCount}টি সঠিক উত্তর দিয়েছেন`;
      document.getElementById('coinsEarned').innerText = `+${coins} পয়েন্ট`;
    }

    function sleep(ms) {
      return new Promise(r => setTimeout(r, ms));
    }

    init();
  </script>
</body>
  </html>
