<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>কুইজ - QuickQuiz</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container">
    <div id="loading" class="center" style="padding-top:60px">প্রশ্ন প্রস্তুত হচ্ছে...</div>

    <div id="quizArea" style="display:none">
      <div class="flex-between text-sm" style="margin-bottom:12px">
        <span>প্রশ্ন <span id="qNum">1</span>/<span id="qTotal">4</span></span>
        <span>সাবমিট: <span id="subCount">0</span>/4</span>
      </div>

      <div id="infoBox" class="info-box" style="display:none"></div>

      <div class="card">
        <h3 id="question" style="font-size:17px;line-height:1.5;margin-bottom:16px"></h3>
        <div id="options"></div>
        <div id="encourage" class="center" style="color:#6ee7b7;font-weight:600;margin:12px 0;display:none"></div>
        <button id="submitBtn" onclick="submitAnswer()" class="btn btn-primary" disabled>জমা দিন</button>
      </div>
    </div>

    <div id="finished" class="center" style="display:none;padding-top:40px">
      <div style="font-size:4rem">🏆</div>
      <h2 style="color:#34d399;margin:12px 0">সেশন সম্পন্ন!</h2>
      <p style="font-size:1.2rem">আপনি পেয়েছেন <strong id="gainedPts" style="color:#34d399">0</strong> পয়েন্ট</p>
      <p class="text-sm mt-2">দারুণ কাজ করেছেন!</p>
      <button onclick="location.href='dashboard.html'" class="btn btn-primary mt-4">ড্যাশবোর্ডে ফিরে যান</button>
    </div>

    <div id="errorArea" class="center" style="display:none;padding-top:50px">
      <p id="errMsg"></p>
      <button onclick="location.href='dashboard.html'" class="btn btn-primary mt-4">ড্যাশবোর্ডে ফিরে যান</button>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="supabase.js"></script>
  <script>
    const ENCOURAGE = [
      'দারুণ! আপনি এগিয়ে যাচ্ছেন 🚀',
      'অসাধারণ! আরও পয়েন্ট জিতুন 💪',
      'বাহ! চমৎকার পারফরম্যান্স 🌟',
      'সাবাশ! আপনি সেরা 🔥',
      'চমৎকার! পয়েন্ট বাড়ছে 🎯',
      'অগ্রগতি চলছে, থামবেন না! ⚡'
    ]

    let user, profile, settings, quizzes = [], current = 0, selected = null
    let submitCount = 0, sessionId = null, pointsGained = 0

    async function init() {
      user = await getUser()
      if (!user) return location.href = 'login.html'

      profile = await getProfile(user.id)
      settings = await getSettings()

      const today = new Date().toISOString().split('T')[0]
      const { count } = await sb.from('user_sessions').select('*', { count: 'exact', head: true })
        .eq('user_id', user.id).eq('session_date', today)

      if (count >= (settings?.daily_max_sessions || 5)) {
        showError('আজকের সেশন শেষ হয়ে গেছে। কাল আবার চেষ্টা করুন!')
        return
      }

      // Create session
      const { data: sess } = await sb.from('user_sessions').insert({
        user_id: user.id,
        session_date: today,
        session_number: (count || 0) + 1
      }).select().single()
      sessionId = sess.id

      // Get quizzes (3-day no repeat)
      const { data: available, error } = await sb.rpc('get_available_quizzes', {
        p_user_id: user.id,
        p_limit: settings?.quizzes_per_session || 4
      })

      if (error || !available || available.length === 0) {
        showError('এখন আর নতুন প্রশ্ন নেই। কিছুক্ষণ পর চেষ্টা করুন।')
        return
      }

      quizzes = available
      document.getElementById('qTotal').textContent = quizzes.length
      document.getElementById('loading').style.display = 'none'
      document.getElementById('quizArea').style.display = 'block'
      showQuestion()
    }

    function showQuestion() {
      const q = quizzes[current]
      document.getElementById('qNum').textContent = current + 1
      document.getElementById('question').textContent = q.question
      selected = null
      document.getElementById('submitBtn').disabled = true
      document.getElementById('encourage').style.display = 'none'

      if (q.info_text) {
        document.getElementById('infoBox').style.display = 'block'
        document.getElementById('infoBox').textContent = '💡 ' + q.info_text
      } else {
        document.getElementById('infoBox').style.display = 'none'
      }

      const opts = document.getElementById('options')
      opts.innerHTML = ''
      ;['A','B','C','D'].forEach(opt => {
        const btn = document.createElement('button')
        btn.className = 'option-btn'
        btn.textContent = opt + '. ' + q['option_' + opt.toLowerCase()]
        btn.onclick = () => {
          document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'))
          btn.classList.add('selected')
          selected = opt
          document.getElementById('submitBtn').disabled = false
        }
        opts.appendChild(btn)
      })
    }

    async function submitAnswer() {
      if (!selected) return
      const q = quizzes[current]
      const isCorrect = selected === q.correct_option

      await sb.from('user_quiz_history').insert({
        user_id: user.id,
        quiz_id: q.id,
        is_correct: isCorrect
      })

      submitCount++
      document.getElementById('subCount').textContent = submitCount

      // Points
      const pts = settings?.points_per_quiz || 10
      await sb.from('profiles').update({
        points: (profile.points || 0) + pts,
        total_earned: (profile.total_earned || 0) + pts
      }).eq('id', user.id)
      profile.points = (profile.points || 0) + pts

      await sb.from('points_log').insert({
        user_id: user.id,
        points: pts,
        reason: 'কুইজ সম্পন্ন'
      })

      pointsGained += pts
      const msg = ENCOURAGE[Math.floor(Math.random() * ENCOURAGE.length)] + ' +' + pts + ' পয়েন্ট'
      const enc = document.getElementById('encourage')
      enc.textContent = msg
      enc.style.display = 'block'

      // Ads: 1st = Monetag, 4th = Adsterra
      if (submitCount === 1) {
        console.log('>>> MONETAG POPUNDER')
        // Real code injection can go here
        if (window.AD_CODES.monetag_popunder) eval(window.AD_CODES.monetag_popunder)
      }
      if (submitCount === 4) {
        console.log('>>> ADSTERRA POPUNDER')
        if (window.AD_CODES.adsterra_popunder) eval(window.AD_CODES.adsterra_popunder)
      }

      // Activate referral if first successful quiz
      if (profile.referred_by) {
        const { data: ref } = await sb.from('referrals')
          .select('*').eq('referred_id', user.id).eq('is_successful', false).maybeSingle()
        if (ref) {
          await sb.from('referrals').update({
            is_successful: true,
            successful_at: new Date().toISOString()
          }).eq('id', ref.id)

          const { data: referrer } = await sb.from('profiles').select('points, successful_referrals').eq('id', profile.referred_by).single()
          const bonus = Math.floor(pts * 0.15)
          await sb.from('profiles').update({
            points: (referrer.points || 0) + bonus,
            successful_referrals: (referrer.successful_referrals || 0) + 1
          }).eq('id', profile.referred_by)
        }
      }

      // Next or finish
      if (current + 1 < quizzes.length) {
        setTimeout(() => {
          current++
          showQuestion()
        }, 1100)
      } else {
        await sb.from('user_sessions').update({
          quizzes_completed: submitCount,
          is_completed: true,
          completed_at: new Date().toISOString()
        }).eq('id', sessionId)

        document.getElementById('quizArea').style.display = 'none'
        document.getElementById('gainedPts').textContent = pointsGained
        document.getElementById('finished').style.display = 'block'
      }
    }

    function showError(msg) {
      document.getElementById('loading').style.display = 'none'
      document.getElementById('errorArea').style.display = 'block'
      document.getElementById('errMsg').textContent = msg
    }

    init()
  </script>
</body>
</html>
