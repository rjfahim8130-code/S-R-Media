<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>কুইজ - NnowQuiz</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
</head>
<body>
  <div class="container page">
    <div class="header">
      <button class="back-btn" onclick="if(confirm('কুইজ ছেড়ে যেতে চান?')) location.href='home.html'">←</button>
      <div class="logo">কুইজ</div>
      <div id="quizProgress" class="badge badge-primary">১/৫</div>
    </div>

    <div class="progress-bar" style="height:8px;background:var(--dark-3);border-radius:20px;overflow:hidden;margin-bottom:16px;">
      <div class="progress-fill" id="progressFill" style="height:100%;width:0%;background:linear-gradient(90deg,#6366f1,#c084fc);border-radius:20px;transition:width 0.3s;"></div>
    </div>

    <!-- প্রবন্ধ সেকশন -->
    <div id="articleSection">
      <div class="card">
        <div class="card-title" id="articleTitle">প্রবন্ধ লোড হচ্ছে...</div>
        <div id="articleContent" style="line-height:1.75;font-size:0.98rem;white-space:pre-line;"></div>
      </div>
      <button class="btn btn-primary" id="startQuestionsBtn" style="display:none;">প্রশ্নোত্তরে যান</button>
    </div>

    <!-- প্রশ্ন সেকশন -->
    <div id="questionsSection" style="display:none;">
      <div class="card">
        <div id="questionNumber" style="font-size:0.85rem;color:var(--primary-light);font-weight:600;margin-bottom:8px;">প্রশ্ন ১</div>
        <div id="questionText" style="font-size:1.1rem;font-weight:600;margin-bottom:20px;line-height:1.5;"></div>
        <div id="optionsContainer"></div>
      </div>

      <button class="btn btn-primary" id="nextBtn" disabled>পরবর্তী প্রশ্ন</button>
      <button class="btn btn-secondary mt-2" id="showArticleBtn">প্রবন্ধ আবার পড়ুন</button>
    </div>

    <!-- রেজাল্ট সেকশন -->
    <div id="resultSection" style="display:none;text-align:center;">
      <div class="card" style="padding:30px 20px;">
        <div style="font-size:3.5rem;margin-bottom:12px;" id="resultEmoji">🎉</div>
        <h2 id="resultTitle" style="margin-bottom:8px;">দারুণ!</h2>
        <p class="text-muted mb-3" id="resultText">আপনি ৫টার মধ্যে ৪টি সঠিক করেছেন</p>
        <div style="font-size:2rem;font-weight:800;color:var(--primary);margin-bottom:20px;" id="coinsEarned">+৪০ কয়েন</div>
        <button class="btn btn-primary" onclick="location.href='home.html'">হোমে যান</button>
      </div>
    </div>
  </div>

  <script>
    let profile = null;
    let currentArticle = null;
    let questions = [];
    let currentQ = 0;
    let answers = {};          // index → selected option index (0-3)
    let currentSet = null;

    async function init() {
      const user = await requireAuth();
      if (!user) return;
      profile = await getProfile();
      if (!profile) {
        showToast('প্রোফাইল লোড সমস্যা', 'error');
        return;
      }

      // কুইজ পজ চেক
      const { data: pause } = await sb.from('app_settings').select('value').eq('key', 'quiz_paused').maybeSingle();
      if (pause?.value === 'true') {
        showToast('কুইজ বর্তমানে বন্ধ আছে', 'error');
        setTimeout(() => location.href = 'home.html', 1500);
        return;
      }

      // দৈনিক/কুলডাউন লিমিট চেক (৮টি কুইজ)
      const twoHoursAgo = new Date(Date.now() - 2 * 60 * 60 * 1000).toISOString();
      const { data: recent } = await sb
        .from('quiz_submissions')
        .select('id')
        .eq('user_id', profile.id)
        .gte('submitted_at', twoHoursAgo);

      if (recent && recent.length >= 8) {
        showToast('২ ঘণ্টায় সর্বোচ্চ ৮টি কুইজ দেওয়া যাবে। পরে আবার চেষ্টা করুন।', 'warning');
        setTimeout(() => location.href = 'home.html', 2000);
        return;
      }

      await loadQuiz();
    }

    async function loadQuiz() {
      // সক্রিয় প্রবন্ধ লোড
      const { data: articles, error } = await sb
        .from('articles')
        .select('*')
        .eq('is_active', true)
        .order('sort_order');

      if (error || !articles || articles.length === 0) {
        document.getElementById('articleTitle').innerText = 'কোনো প্রবন্ধ নেই';
        return;
      }

      // সহজ রোটেশন: ইউজার যতগুলো কুইজ দিয়েছে তার উপর ভিত্তি করে প্রবন্ধ বাছাই
      const quizCount = profile.total_quizzes_submitted || 0;
      currentArticle = articles[quizCount % articles.length];

      document.getElementById('articleTitle').innerText = currentArticle.title;
      document.getElementById('articleContent').innerText = currentArticle.content || '';
      document.getElementById('startQuestionsBtn').style.display = 'block';

      // এই প্রবন্ধের প্রশ্ন লোড
      const { data: allQuestions } = await sb
        .from('questions')
        .select('*')
        .eq('article_id', currentArticle.id)
        .order('id');

      if (!allQuestions || allQuestions.length === 0) {
        document.getElementById('startQuestionsBtn').innerText = 'এই প্রবন্ধে এখনো প্রশ্ন নেই';
        document.getElementById('startQuestionsBtn').disabled = true;
        return;
      }

      // সেট অনুযায়ী গ্রুপ করা
      const sets = {};
      allQuestions.forEach(q => {
        const setName = q.category || 'set_1';
        if (!sets[setName]) sets[setName] = [];
        sets[setName].push(q);
      });

      const setNames = Object.keys(sets).sort((a, b) => {
        return parseInt(a.replace('set_', '')) - parseInt(b.replace('set_', ''));
      });

      // পরবর্তী সেট বাছাই (রোটেশন)
      const setIndex = quizCount % setNames.length;
      currentSet = setNames[setIndex];
      questions = sets[currentSet].slice(0, 5); // সর্বদা সর্বোচ্চ ৫টি

      if (questions.length === 0) {
        document.getElementById('startQuestionsBtn').innerText = 'প্রশ্ন নেই';
        document.getElementById('startQuestionsBtn').disabled = true;
      }
    }

    // প্রশ্নোত্তর শুরু
    document.getElementById('startQuestionsBtn').onclick = () => {
      document.getElementById('articleSection').style.display = 'none';
      document.getElementById('questionsSection').style.display = 'block';
      currentQ = 0;
      answers = {};
      showQuestion();
    };

    // প্রবন্ধ আবার দেখানো
    document.getElementById('showArticleBtn').onclick = () => {
      document.getElementById('questionsSection').style.display = 'none';
      document.getElementById('articleSection').style.display = 'block';
    };

    function showQuestion() {
      const q = questions[currentQ];
      document.getElementById('questionNumber').innerText = `প্রশ্ন ${currentQ + 1} / ${questions.length}`;
      document.getElementById('questionText').innerText = q.question_text;
      document.getElementById('quizProgress').innerText = `\( {currentQ + 1}/ \){questions.length}`;
      document.getElementById('progressFill').style.width = `${((currentQ + 1) / questions.length) * 100}%`;

      const options = q.options || [];
      const labels = ['A', 'B', 'C', 'D'];

      document.getElementById('optionsContainer').innerHTML = options.map((opt, idx) => `
        <div class="option ${answers[currentQ] === idx ? 'selected' : ''}" 
             onclick="selectOption(${idx})"
             style="display:flex;gap:12px;align-items:center;padding:14px;background:var(--dark);border:2px solid ${answers[currentQ] === idx ? 'var(--primary)' : 'var(--dark-3)'};border-radius:12px;margin-bottom:10px;cursor:pointer;">
          <div style="width:32px;height:32px;border-radius:50%;background:var(--dark-3);display:flex;align-items:center;justify-content:center;font-weight:700;">${labels[idx]}</div>
          <div>${opt}</div>
        </div>
      `).join('');

      const btn = document.getElementById('nextBtn');
      btn.innerText = currentQ === questions.length - 1 ? 'কুইজ জমা দিন' : 'পরবর্তী প্রশ্ন';
      btn.disabled = answers[currentQ] === undefined;
    }

    window.selectOption = (idx) => {
      answers[currentQ] = idx;
      showQuestion();
    };

    document.getElementById('nextBtn').onclick = async () => {
      if (answers[currentQ] === undefined) return;

      if (currentQ < questions.length - 1) {
        currentQ++;
        showQuestion();
      } else {
        // জমা দেওয়া
        let correct = 0;
        questions.forEach((q, i) => {
          if (answers[i] === q.correct_answer) correct++;
        });

        const coins = correct * 10;

        // সাবমিশন সেভ
        await sb.from('quiz_submissions').insert({
          user_id: profile.id,
          article_id: currentArticle.id,
          set_number: parseInt(currentSet.replace('set_', '')) || 1,
          score: correct,
          coins_earned: coins
        });

        // প্রোফাইল আপডেট
        await sb.from('profiles').update({
          coins: (profile.coins || 0) + coins,
          total_quizzes_submitted: (profile.total_quizzes_submitted || 0) + 1,
          last_quiz_at: new Date().toISOString()
        }).eq('id', profile.id);

        // রেজাল্ট দেখানো
        document.getElementById('questionsSection').style.display = 'none';
        document.getElementById('resultSection').style.display = 'block';

        document.getElementById('resultEmoji').innerText = correct >= 4 ? '🎉' : correct >= 2 ? '👍' : '💪';
        document.getElementById('resultTitle').innerText = correct >= 4 ? 'দারুণ!' : correct >= 2 ? 'ভালো করেছেন!' : 'আবার চেষ্টা করুন!';
        document.getElementById('resultText').innerText = `আপনি ${questions.length}টির মধ্যে ${correct}টি সঠিক করেছেন`;
        document.getElementById('coinsEarned').innerText = `+${coins} কয়েন`;
      }
    };

    init();
  </script>
</body>
</html>
