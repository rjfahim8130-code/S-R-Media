<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>কুইজ - NnowQuiz</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <style>
    .question-card {
      background: var(--dark-2);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
    }
    .option-btn {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 12px 14px;
      background: var(--dark);
      border: 2px solid var(--dark-3);
      border-radius: 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: 0.2s;
    }
    .option-btn.selected {
      border-color: var(--primary);
      background: rgba(99,102,241,0.15);
    }
    .option-label {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--dark-3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.9rem;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="container page">
    <div class="header">
      <button class="back-btn" onclick="if(confirm('কুইজ ছেড়ে যেতে চান?')) location.href='home.html'">←</button>
      <div class="logo">কুইজ</div>
      <div id="quizProgress" class="badge badge-primary">০/৫</div>
    </div>

    <!-- প্রবন্ধ সেকশন -->
    <div id="articleSection">
      <div class="card">
        <div class="card-title" id="articleTitle">প্রবন্ধ লোড হচ্ছে...</div>
        <div id="articleContent" style="line-height:1.75;font-size:0.98rem;white-space:pre-line;"></div>
      </div>
      <button class="btn btn-primary" id="startQuestionsBtn" style="display:none;">প্রশ্নোত্তরে যান</button>
    </div>

    <!-- প্রশ্ন সেকশন (সব এক পেজে) -->
    <div id="questionsSection" style="display:none;">
      <div id="allQuestions"></div>
      <button class="btn btn-primary" id="submitBtn" disabled>কুইজ জমা দিন</button>
      <button class="btn btn-secondary mt-2" id="showArticleBtn">প্রবন্ধ আবার পড়ুন</button>
    </div>

    <!-- রেজাল্ট সেকশন -->
    <div id="resultSection" style="display:none;text-align:center;">
      <div class="card" style="padding:30px 20px;">
        <div style="font-size:3.5rem;margin-bottom:12px;" id="resultEmoji">🎉</div>
        <h2 id="resultTitle" style="margin-bottom:8px;">দারুণ!</h2>
        <p class="text-muted mb-3" id="resultText"></p>
        <div style="font-size:2rem;font-weight:800;color:var(--primary);margin-bottom:20px;" id="coinsEarned"></div>
        <button class="btn btn-primary" onclick="location.href='home.html'">হোমে যান</button>
      </div>
    </div>
  </div>

  <script>
    let profile = null;
    let currentArticle = null;
    let questions = [];
    let answers = {};
    let currentSet = null;

    async function init() {
      const user = await requireAuth();
      if (!user) return;
      profile = await getProfile();
      if (!profile) return;

      const { data: pause } = await sb.from('app_settings').select('value').eq('key', 'quiz_paused').maybeSingle();
      if (pause?.value === 'true') {
        showToast('কুইজ বর্তমানে বন্ধ আছে', 'error');
        setTimeout(() => location.href = 'home.html', 1500);
        return;
      }

      const twoHoursAgo = new Date(Date.now() - 2 * 60 * 60 * 1000).toISOString();
      const { data: recent } = await sb.from('quiz_submissions').select('id').eq('user_id', profile.id).gte('submitted_at', twoHoursAgo);
      if (recent && recent.length >= 8) {
        showToast('২ ঘণ্টায় সর্বোচ্চ ৮টি কুইজ দেওয়া যাবে', 'warning');
        setTimeout(() => location.href = 'home.html', 2000);
        return;
      }

      await loadQuiz();
    }

    async function loadQuiz() {
      const { data: articlesWithQuestions } = await sb
        .from('questions')
        .select('article_id, articles(id, title, content, sort_order)')
        .not('article_id', 'is', null);

      if (!articlesWithQuestions || articlesWithQuestions.length === 0) {
        document.getElementById('articleTitle').innerText = 'কোনো প্রবন্ধে প্রশ্ন নেই';
        return;
      }

      const uniqueArticles = [];
      const seen = new Set();
      articlesWithQuestions.forEach(item => {
        if (item.articles && !seen.has(item.articles.id)) {
          seen.add(item.articles.id);
          uniqueArticles.push(item.articles);
        }
      });
      uniqueArticles.sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));

      const quizCount = profile.total_quizzes_submitted || 0;
      currentArticle = uniqueArticles[quizCount % uniqueArticles.length];

      document.getElementById('articleTitle').innerText = currentArticle.title;
      document.getElementById('articleContent').innerText = currentArticle.content || '';
      document.getElementById('startQuestionsBtn').style.display = 'block';

      const { data: allQuestions } = await sb
        .from('questions')
        .select('*')
        .eq('article_id', currentArticle.id)
        .order('id');

      if (!allQuestions || allQuestions.length === 0) {
        document.getElementById('startQuestionsBtn').innerText = 'এই প্রবন্ধে এখনো প্রশ্ন নেই';
        document.getElementById('startQuestionsBtn').disabled = true;
        return;
      }

      const sets = {};
      allQuestions.forEach(q => {
        const setName = q.category || 'set_1';
        if (!sets[setName]) sets[setName] = [];
        sets[setName].push(q);
      });

      const setNames = Object.keys(sets).sort((a, b) => parseInt(a.replace('set_', '')) - parseInt(b.replace('set_', '')));
      currentSet = setNames[quizCount % setNames.length];
      questions = sets[currentSet].slice(0, 5);

      document.getElementById('quizProgress').innerText = '০/' + questions.length;
    }

    document.getElementById('startQuestionsBtn').onclick = () => {
      document.getElementById('articleSection').style.display = 'none';
      document.getElementById('questionsSection').style.display = 'block';
      renderAllQuestions();
    };

    document.getElementById('showArticleBtn').onclick = () => {
      document.getElementById('questionsSection').style.display = 'none';
      document.getElementById('articleSection').style.display = 'block';
    };

    function renderAllQuestions() {
      const container = document.getElementById('allQuestions');
      const labels = ['A', 'B', 'C', 'D'];
      let html = '';

      questions.forEach((q, qIndex) => {
        html += '<div class="question-card">';
        html += '<div style="font-size:0.85rem;color:var(--primary-light);font-weight:600;margin-bottom:6px;">প্রশ্ন ' + (qIndex + 1) + ' / ' + questions.length + '</div>';
        html += '<div style="font-size:1.05rem;font-weight:600;margin-bottom:14px;line-height:1.5;">' + q.question_text + '</div>';

        (q.options || []).forEach((opt, idx) => {
          const selected = answers[qIndex] === idx ? 'selected' : '';
          html += '<div class="option-btn ' + selected + '" onclick="selectOption(' + qIndex + ',' + idx + ')">';
          html += '<div class="option-label">' + labels[idx] + '</div>';
          html += '<div>' + opt + '</div>';
          html += '</div>';
        });

        html += '</div>';
      });

      container.innerHTML = html;
      updateProgress();
    }

    window.selectOption = (qIndex, optIndex) => {
      answers[qIndex] = optIndex;
      renderAllQuestions();
    };

    function updateProgress() {
      const answered = Object.keys(answers).length;
      document.getElementById('quizProgress').innerText = answered + '/' + questions.length;
      document.getElementById('submitBtn').disabled = answered < questions.length;
    }

    document.getElementById('submitBtn').onclick = async () => {
      let correct = 0;
      questions.forEach((q, i) => {
        if (answers[i] === q.correct_answer) correct++;
      });

      const coins = correct * 10;

      await sb.from('quiz_submissions').insert({
        user_id: profile.id,
        article_id: currentArticle.id,
        set_number: parseInt((currentSet || 'set_1').replace('set_', '')) || 1,
        score: correct,
        coins_earned: coins
      });

      await sb.from('profiles').update({
        coins: (profile.coins || 0) + coins,
        total_quizzes_submitted: (profile.total_quizzes_submitted || 0) + 1,
        last_quiz_at: new Date().toISOString()
      }).eq('id', profile.id);

      document.getElementById('questionsSection').style.display = 'none';
      document.getElementById('resultSection').style.display = 'block';

      document.getElementById('resultEmoji').innerText = correct >= 4 ? '🎉' : correct >= 2 ? '👍' : '💪';
      document.getElementById('resultTitle').innerText = correct >= 4 ? 'দারুণ!' : correct >= 2 ? 'ভালো করেছেন!' : 'আবার চেষ্টা করুন!';
      document.getElementById('resultText').innerText = 'আপনি ' + questions.length + 'টির মধ্যে ' + correct + 'টি সঠিক করেছেন';
      document.getElementById('coinsEarned').innerText = '+' + coins + ' কয়েন';
    };

    init();
  </script>
</body>
</html>
