<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S R Media</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h2>🎬 S R Media</h2>
            <input type="text" id="searchInput" placeholder="ভিডিও বা সিরিজ সার্চ করুন...">
        </header>

        <div class="categories">
            <button class="tab-btn active" data-cat="all">সব</button>
            <button class="tab-btn" data-cat="movies">মুভিজ</button>
            <button class="tab-btn" data-cat="turkish_series">তুর্কি সিরিজ</button>
            <button class="tab-btn" data-cat="cartoons">কার্টুন</button>
        </div>

        <div id="videoGrid" class="video-grid">
            <p class="loading">লোড হচ্ছে...</p>
        </div>
    </div>

    <!-- Player Modal -->
    <div id="playerModal" class="modal hidden">
        <button id="closeModal">✖ বন্ধ করুন</button>
        <h3 id="playerTitle">ভিডিও টাইটেল</h3>

        <div class="video-wrapper">
            <video id="mainPlayer" controls playsinline controlsList="nodownload"></video>
        </div>

        <div class="nav-buttons" style="margin-top:15px; display:flex; gap:10px; justify-content:center;">
            <button id="prevEp" style="display:none; padding:8px 16px; border:none; border-radius:6px; background:#2b5278; color:#fff; cursor:pointer;">◀ আগের পর্ব</button>
            <button id="nextEp" style="display:none; padding:8px 16px; border:none; border-radius:6px; background:#2b5278; color:#fff; cursor:pointer;">পরের পর্ব ▶</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
