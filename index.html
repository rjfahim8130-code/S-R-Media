<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S R Media</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h2>🎬 S R Media</h2>
        </header>
        <div id="videoGrid" class="video-grid"></div>
    </div>

    <!-- Player Modal -->
    <div id="playerModal" class="modal hidden">
        <button id="closeModal" aria-label="Close">✖</button>
        <h3 id="playerTitle">ভিডিও টাইটেল</h3>
        <div class="video-wrapper">
            <video id="mainPlayer" controls playsinline controlsList="nodownload"></video>
        </div>
        <div class="nav-buttons">
            <button id="prevEp" class="nav-btn">◀ আগের পর্ব</button>
            <button id="nextEp" class="nav-btn">পরের পর্ব ▶</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
