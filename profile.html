<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>প্রোফাইল - NnowQuiz</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
</head>
<body>
  <div class="container page">
    <div class="header">
      <button class="back-btn" onclick="history.back()">←</button>
      <div class="logo">প্রোফাইল</div>
      <div style="width:40px;"></div>
    </div>
    <div id="profileBox"><div class="loading"><div class="spinner"></div></div></div>
  </div>

  <div class="bottom-nav">
    <a href="home.html" class="nav-item"><span class="icon">🏠</span><span>হোম</span></a>
    <a href="articles.html" class="nav-item"><span class="icon">📚</span><span>প্রবন্ধ</span></a>
    <a href="leaderboard.html" class="nav-item"><span class="icon">🏆</span><span>র‍্যাঙ্ক</span></a>
    <a href="profile.html" class="nav-item active"><span class="icon">👤</span><span>প্রোফাইল</span></a>
  </div>

  <script>
    async function load() {
      const user = await requireAuth();
      if (!user) return;
      const profile = await getProfile();
      if (!profile) return showToast('প্রোফাইল লোড ব্যর্থ', 'error');

      const { data: bonuses } = await sb.from('referral_bonuses')
        .select('*')
        .eq('referrer_id', profile.id)
        .eq('is_claimed', false)
        .gt('expires_at', new Date().toISOString());

      const link = `\( {location.origin}/register.html?ref= \){profile.referral_code}`;

      document.getElementById('profileBox').innerHTML = `
        <div class="card text-center" style="padding:28px 20px;">
          <div style="width:70px;height:70px;background:linear-gradient(135deg,#6366f1,#c084fc);border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;font-weight:800;">
            ${(profile.full_name||'U')[0].toUpperCase()}
          </div>
          <h2>${profile.full_name || 'ইউজার'}</h2>
          <p class="text-muted">${user.email}</p>
        </div>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-value">${formatNumber(profile.coins)}</div>
            <div class="stat-label">পয়েন্ট</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${formatNumber(profile.total_quizzes_submitted)}</div>
            <div class="stat-label">কুইজ</div>
          </div>
        </div>

        <div class="card">
          <div class="card-title">রেফার কোড</div>
          <div style="background:var(--dark);padding:14px;border-radius:12px;text-align:center;font-size:1.3rem;font-weight:800;letter-spacing:2px;margin-bottom:12px;">
            ${profile.referral_code || '------'}
          </div>
          <button class="btn btn-secondary btn-sm" onclick="navigator.clipboard.writeText('${link}').then(()=>showToast('লিংক কপি হয়েছে'))">লিংক কপি করুন</button>
        </div>

        <div class="card">
          <div class="card-title">রেফার বোনাস</div>
          ${bonuses?.length ? bonuses.map(b => `
            <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.06);">
              <div>
                <div style="font-weight:600;">+${b.bonus_amount} পয়েন্ট</div>
                <div class="text-muted" style="font-size:0.8rem;">মেয়াদ শেষ: ${timeAgo(b.expires_at)}</div>
              </div>
              <button class="btn btn-sm btn-success" onclick="claim('\( {b.id}', \){b.bonus_amount})">ক্লেইম</button>
            </div>
          `).join('') : '<p class="text-muted text-center">কোনো বোনাস নেই</p>'}
        </div>

        <button class="btn btn-danger mt-3" onclick="if(confirm('লগআউট?')) signOut()">লগআউট</button>
      `;
    }

    window.claim = async (id, amount) => {
      await sb.from('referral_bonuses').update({is_claimed:true, claimed_at:new Date().toISOString()}).eq('id', id);
      const p = await getProfile();
      await sb.from('profiles').update({coins: (p.coins||0) + amount}).eq('id', p.id);
      showToast(`+${amount} পয়েন্ট ক্লেইম হয়েছে!`);
      load();
    };

    load();
  </script>
</body>
</html>
