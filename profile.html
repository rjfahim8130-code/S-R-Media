<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>প্রোফাইল - NnowQuiz</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
</head>
<body>
  <div class="container page">
    <div class="header">
      <button class="back-btn" onclick="history.back()">←</button>
      <div class="logo">প্রোফাইল</div>
      <div style="width:40px;"></div>
    </div>
    <div id="profileBox">
      <div class="loading"><div class="spinner"></div></div>
    </div>
  </div>

  <div class="bottom-nav">
    <a href="home.html" class="nav-item"><span class="icon">🏠</span><span>হোম</span></a>
    <a href="articles.html" class="nav-item"><span class="icon">📚</span><span>প্রবন্ধ</span></a>
    <a href="leaderboard.html" class="nav-item"><span class="icon">🏆</span><span>র‍্যাঙ্ক</span></a>
    <a href="profile.html" class="nav-item active"><span class="icon">👤</span><span>প্রোফাইল</span></a>
  </div>

  <script>
    let currentProfile = null;

    async function loadProfile() {
      const user = await requireAuth();
      if (!user) return;

      currentProfile = await getProfile();
      if (!currentProfile) {
        showToast('প্রোফাইল লোড ব্যর্থ', 'error');
        return;
      }

      const { data: bonuses } = await sb
        .from('referral_bonuses')
        .select('*')
        .eq('referrer_id', currentProfile.id)
        .eq('is_claimed', false)
        .gt('expires_at', new Date().toISOString());

      const referralLink = window.location.origin + '/register.html?ref=' + (currentProfile.referral_code || '');

      // Admin button updated link
      const adminButton = currentProfile.is_admin 
        ? `<a href="admin-panel.html" class="btn btn-primary mb-3">এডমিন প্যানেল</a>` 
        : '';

      document.getElementById('profileBox').innerHTML = `
        <div class="card text-center" style="padding:28px 20px;">
          <div style="width:70px;height:70px;background:linear-gradient(135deg,#6366f1,#c084fc);border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;font-weight:800;">
            ${(currentProfile.full_name || 'U').charAt(0).toUpperCase()}
          </div>
          <h2 style="margin-bottom:4px;">${currentProfile.full_name || 'ইউজার'}</h2>
          <p class="text-muted">${user.email}</p>
        </div>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-value">${formatNumber(currentProfile.coins)}</div>
            <div class="stat-label">পয়েন্ট</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${formatNumber(currentProfile.total_quizzes_submitted)}</div>
            <div class="stat-label">কুইজ</div>
          </div>
        </div>

        ${adminButton}

        <div class="card">
          <div class="card-title">রেফার কোড</div>
          <div style="background:var(--dark);padding:14px;border-radius:12px;text-align:center;font-size:1.3rem;font-weight:800;letter-spacing:2px;margin-bottom:12px;">
            ${currentProfile.referral_code || '------'}
          </div>
          <button class="btn btn-secondary btn-sm" id="copyLinkBtn">লিংক কপি করুন</button>
        </div>

        <div class="card">
          <div class="card-title">রেফার বোনাস</div>
          ${bonuses && bonuses.length > 0 ? bonuses.map(b => `
            <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.06);">
              <div>
                <div style="font-weight:600;">+${b.bonus_amount} পয়েন্ট</div>
                <div class="text-muted" style="font-size:0.8rem;">মেয়াদ: ${timeAgo(b.expires_at)}</div>
              </div>
              <button class="btn btn-sm btn-success" onclick="claimBonus('${b.id}', ${b.bonus_amount})">ক্লেইম</button>
            </div>
          `).join('') : '<p class="text-muted text-center">কোনো বোনাস নেই</p>'}
        </div>

        <button class="btn btn-danger mt-3" onclick="if(confirm('লগআউট করতে চান?')) signOut()">লগআউট</button>
      `;

      document.getElementById('copyLinkBtn').addEventListener('click', () => {
        navigator.clipboard.writeText(referralLink).then(() => {
          showToast('রেফার লিংক কপি হয়েছে!');
        }).catch(() => {
          showToast('কপি করতে সমস্যা হয়েছে', 'error');
        });
      });
    }

    async function claimBonus(id, amount) {
      await sb.from('referral_bonuses')
        .update({ is_claimed: true, claimed_at: new Date().toISOString() })
        .eq('id', id);

      await sb.from('profiles')
        .update({ coins: (currentProfile.coins || 0) + amount })
        .eq('id', currentProfile.id);

      showToast(`+${amount} পয়েন্ট ক্লেইম হয়েছে!`);
      loadProfile();
    }

    loadProfile();
  </script>
</body>
</html>
