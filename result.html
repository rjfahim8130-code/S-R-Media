<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>রেজাল্ট - NnowQuiz</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
</head>
<body>
  <div class="container page">
    <div class="header">
      <div class="logo">রেজাল্ট</div>
    </div>
    <div id="resultBox">
      <div class="loading"><div class="spinner"></div></div>
    </div>
  </div>

  <script>
    (async () => {
      await requireAuth();
      const data = sessionStorage.getItem('quizResult');
      if (!data) return location.href = 'home.html';

      const r = JSON.parse(data);
      sessionStorage.removeItem('quizResult');
      const pct = Math.round((r.correct / r.total) * 100);
      let msg = pct >= 80 ? 'দারুণ!' : pct >= 60 ? 'ভালো!' : pct >= 40 ? 'আরও চেষ্টা করুন' : 'প্রবন্ধ আবার পড়ুন';

      document.getElementById('resultBox').innerHTML = `
        <div class="card text-center" style="padding:32px 20px;">
          <div style="font-size:3.5rem;margin-bottom:12px;">${pct>=80?'🔥':pct>=60?'👍':'📚'}</div>
          <h2 style="margin-bottom:8px;">${msg}</h2>
          <p class="text-muted mb-3">${r.articleTitle}</p>
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-value">\( {r.correct}/ \){r.total}</div>
              <div class="stat-label">সঠিক</div>
            </div>
            <div class="stat-card">
              <div class="stat-value" style="color:#34d399;">+${r.coins}</div>
              <div class="stat-label">পয়েন্ট</div>
            </div>
          </div>
          <a href="quiz.html" class="btn btn-primary mb-2">আবার খেলুন</a>
          <a href="home.html" class="btn btn-secondary">হোমে যান</a>
        </div>
      `;
    })();
  </script>
</body>
</html>
