<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>প্রবন্ধ - NnowQuiz</title>
  
  <meta name="monetag" content="5d5bd8350ba1e36f1af8d3b4b95c4595">
  <meta name="8645434d5e68c17799df1ccb083d05cc97221a9c" content="8645434d5e68c17799df1ccb083d05cc97221a9c" />
  <meta name="clckd" content="85de58977d8432e90f4c1b625a374f3d" />

  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="ads.js"></script>
</head>
<body>
  <div class="container page">
    <div class="header">
      <button class="back-btn" onclick="location.href='articles.html'">←</button>
      <div class="logo">প্রবন্ধ</div>
      <div style="width:40px;"></div>
    </div>

    <div class="card">
      <div class="card-title" id="articleTitle">লোড হচ্ছে...</div>
      <div id="articleContent" style="line-height:1.8;font-size:1rem;white-space:pre-line;margin-top:12px;"></div>
    </div>

    <!-- Native অ্যাড -->
    <div id="articleNativeAd" style="min-height:100px;margin:16px 0;display:flex;justify-content:center;"></div>

    <div class="card text-center">
      <p class="text-muted mb-2">এই প্রবন্ধ পড়ে কুইজ খেলতে চান?</p>
      <a href="quiz.html" class="btn btn-primary">কুইজ খেলুন</a>
    </div>
  </div>

  <div class="bottom-nav">
    <a href="home.html" class="nav-item">
      <span>🏠</span>
      <span>হোম</span>
    </a>
    <a href="articles.html" class="nav-item active">
      <span>📖</span>
      <span>প্রবন্ধ</span>
    </a>
    <a href="leaderboard.html" class="nav-item">
      <span>🏆</span>
      <span>লিডারবোর্ড</span>
    </a>
    <a href="profile.html" class="nav-item">
      <span>👤</span>
      <span>প্রোফাইল</span>
    </a>
  </div>

  <script>
    let interstitialTimer = null;

    async function init() {
      const user = await requireAuth();
      if (!user) return;

      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');

      if (!id) {
        document.getElementById('articleTitle').innerText = 'প্রবন্ধ পাওয়া যায়নি';
        return;
      }

      const { data, error } = await sb.from('articles')
        .select('*')
        .eq('id', id)
        .single();

      if (error || !data) {
        document.getElementById('articleTitle').innerText = 'প্রবন্ধ লোড করতে সমস্যা হয়েছে';
        return;
      }

      document.getElementById('articleTitle').innerText = data.title;
      document.getElementById('articleContent').innerText = data.content;
      document.title = data.title + ' - NnowQuiz';

      // Native অ্যাড
      AdManager.showNative('articleNativeAd');

      // ৯ মিনিট পর পর Interstitial
      interstitialTimer = setInterval(() => {
        AdManager.showInterstitial();
      }, 9 * 60 * 1000);
    }

    window.addEventListener('beforeunload', () => {
      if (interstitialTimer) clearInterval(interstitialTimer);
    });

    init();
  </script>
</body>
</html>
