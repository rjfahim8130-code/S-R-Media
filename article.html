<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>প্রবন্ধ - NnowQuiz</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container page">
    <div class="header">
      <button class="back-btn" onclick="history.back()">←</button>
      <div class="logo">প্রবন্ধ</div>
      <div style="width:40px;"></div>
    </div>

    <div id="articleContainer">
      <div class="loading">
        <div class="spinner"></div>
        <p>প্রবন্ধ লোড হচ্ছে...</p>
      </div>
    </div>

    <div style="margin-top:24px;">
      <a href="articles.html" class="btn btn-secondary">← সব প্রবন্ধে ফিরে যান</a>
    </div>
  </div>

  <script src="supabase.js"></script>
  <script>
    async function loadArticle() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');

      if (!id) {
        document.getElementById('articleContainer').innerHTML = `
          <div class="empty-state">
            <p>প্রবন্ধ পাওয়া যায়নি</p>
            <a href="articles.html" class="btn btn-primary mt-3">ফিরে যান</a>
          </div>
        `;
        return;
      }

      const { data: article, error } = await supabase
        .from('articles')
        .select('*')
        .eq('id', id)
        .eq('is_active', true)
        .single();

      const container = document.getElementById('articleContainer');

      if (error || !article) {
        container.innerHTML = `
          <div class="empty-state">
            <div style="font-size:3rem;">❌</div>
            <p>প্রবন্ধ লোড করা যায়নি</p>
            <a href="articles.html" class="btn btn-primary mt-3">ফিরে যান</a>
          </div>
        `;
        return;
      }

      document.title = article.title + ' - NnowQuiz';

      container.innerHTML = `
        <div class="card">
          <h1 style="font-size:1.4rem;font-weight:800;margin-bottom:16px;line-height:1.4;">${article.title}</h1>
          <div style="font-size:1.05rem;line-height:1.8;color:#e2e8f0;">
            \( {article.content.split('\n').map(p => p.trim() ? `<p style="margin-bottom:16px;"> \){p}</p>` : '').join('')}
          </div>
        </div>
      `;
    }

    loadArticle();
  </script>
</body>
</html>
