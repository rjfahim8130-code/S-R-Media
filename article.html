<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>প্রবন্ধ - NnowQuiz</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
</head>
<body>
  <div class="container page">
    <div class="header">
      <button class="back-btn" onclick="history.back()">←</button>
      <div class="logo">প্রবন্ধ</div>
      <div style="width:40px;"></div>
    </div>

    <div id="articleBox">
      <div class="loading"><div class="spinner"></div></div>
    </div>
  </div>

  <script>
    async function load() {
      const params = new URLSearchParams(location.search);
      const id = params.get('id');
      if (!id) {
        document.getElementById('articleBox').innerHTML = '<p class="text-muted text-center">প্রবন্ধ পাওয়া যায়নি</p>';
        return;
      }

      const { data, error } = await sb.from('articles').select('*').eq('id', id).single();
      if (error || !data) {
        document.getElementById('articleBox').innerHTML = '<p class="text-muted text-center">প্রবন্ধ পাওয়া যায়নি</p>';
        return;
      }

      document.getElementById('articleBox').innerHTML = `
        <div class="card">
          <div class="card-title">${data.title}</div>
          <div style="line-height:1.75;white-space:pre-line;font-size:0.98rem;">${data.content || ''}</div>
        </div>
      `;
    }
    load();
  </script>
</body>
</html>
