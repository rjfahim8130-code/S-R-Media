<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>প্রশ্ন ম্যানেজ - NnowQuiz</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <style>
    .question-block {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .question-block h4 {
      margin: 0 0 12px;
      font-size: 0.95rem;
      color: var(--primary);
    }
    .set-info {
      background: linear-gradient(135deg, #312e81, #1e1b4b);
      padding: 12px 16px;
      border-radius: 12px;
      margin-top: 12px;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="container page">
    <div class="header">
      <button class="back-btn" onclick="location.href='admin-panel.html'">←</button>
      <div class="logo">প্রশ্ন ম্যানেজ</div>
      <div style="width:40px;"></div>
    </div>

    <div class="card">
      <div class="card-title">প্রবন্ধ সিলেক্ট করুন</div>
      <select id="articleSelect" class="form-control">
        <option value="">প্রবন্ধ বাছাই করুন</option>
      </select>
      <div id="setInfo" class="set-info" style="display:none;"></div>
    </div>

    <div class="card" id="questionsForm" style="display:none;">
      <div class="card-title">নতুন সেট যোগ করুন (৫টি প্রশ্ন)</div>
      <div id="questionsContainer"></div>
      <button class="btn btn-primary" id="saveSetBtn">এই সেট সেভ করুন</button>
    </div>

    <div class="card">
      <div class="card-title">বিদ্যমান সেটসমূহ</div>
      <div id="existingSets">
        <p class="text-muted text-center">প্রথমে প্রবন্ধ সিলেক্ট করুন</p>
      </div>
    </div>
  </div>

  <script>
    let selectedArticleId = null;
    let nextSetNumber = 1;

    async function init() {
      await requireAdmin();
      await loadArticles();
    }

    async function loadArticles() {
      const { data, error } = await sb
        .from('articles')
        .select('id, title')
        .eq('is_active', true)
        .order('sort_order');

      const select = document.getElementById('articleSelect');

      if (error || !data || data.length === 0) {
        select.innerHTML = '<option value="">কোনো প্রবন্ধ নেই</option>';
        return;
      }

      let options = '<option value="">প্রবন্ধ বাছাই করুন</option>';
      data.forEach(function(article) {
        options += '<option value="' + article.id + '">' + article.title + '</option>';
      });
      select.innerHTML = options;
    }

    document.getElementById('articleSelect').addEventListener('change', async function() {
      selectedArticleId = this.value;
      const form = document.getElementById('questionsForm');
      const setInfo = document.getElementById('setInfo');

      if (!selectedArticleId) {
        form.style.display = 'none';
        setInfo.style.display = 'none';
        document.getElementById('existingSets').innerHTML = '<p class="text-muted text-center">প্রথমে প্রবন্ধ সিলেক্ট করুন</p>';
        return;
      }

      // পরবর্তী সেট নম্বর বের করা
      const { data: existing } = await sb
        .from('questions')
        .select('category')
        .eq('article_id', selectedArticleId);

      let maxSet = 0;
      if (existing && existing.length > 0) {
        existing.forEach(function(q) {
          const num = parseInt((q.category || '').replace('set_', '')) || 0;
          if (num > maxSet) maxSet = num;
        });
      }
      nextSetNumber = maxSet + 1;

      setInfo.style.display = 'block';
      setInfo.innerHTML = 'পরবর্তী সেট নম্বর: <strong>সেট ' + nextSetNumber + '</strong> (অটো)';

      form.style.display = 'block';
      renderQuestionForms();
      loadExistingSets();
    });

    function renderQuestionForms() {
      const container = document.getElementById('questionsContainer');
      let html = '';

      for (let i = 1; i <= 5; i++) {
        html += `
          <div class="question-block">
            <h4>প্রশ্ন ${i}</h4>
            <div class="form-group">
              <label>প্রশ্ন</label>
              <textarea id="q${i}_text" class="form-control" rows="2" placeholder="প্রশ্ন লিখুন"></textarea>
            </div>
            <div class="form-group">
              <label>অপশন A</label>
              <input type="text" id="q${i}_a" class="form-control" placeholder="অপশন A">
            </div>
            <div class="form-group">
              <label>অপশন B</label>
              <input type="text" id="q${i}_b" class="form-control" placeholder="অপশন B">
            </div>
            <div class="form-group">
              <label>অপশন C</label>
              <input type="text" id="q${i}_c" class="form-control" placeholder="অপশন C">
            </div>
            <div class="form-group">
              <label>অপশন D</label>
              <input type="text" id="q${i}_d" class="form-control" placeholder="অপশন D">
            </div>
            <div class="form-group">
              <label>সঠিক উত্তর</label>
              <select id="q${i}_correct" class="form-control">
                <option value="0">A</option>
                <option value="1">B</option>
                <option value="2">C</option>
                <option value="3">D</option>
              </select>
            </div>
          </div>
        `;
      }
      container.innerHTML = html;
    }

    document.getElementById('saveSetBtn').addEventListener('click', async function() {
      if (!selectedArticleId) {
        showToast('প্রথমে প্রবন্ধ সিলেক্ট করুন', 'error');
        return;
      }

      const questions = [];

      for (let i = 1; i <= 5; i++) {
        const text = document.getElementById('q' + i + '_text').value.trim();
        const a = document.getElementById('q' + i + '_a').value.trim();
        const b = document.getElementById('q' + i + '_b').value.trim();
        const c = document.getElementById('q' + i + '_c').value.trim();
        const d = document.getElementById('q' + i + '_d').value.trim();
        const correct = parseInt(document.getElementById('q' + i + '_correct').value);

        if (!text || !a || !b || !c || !d) {
          showToast('প্রশ্ন ' + i + ' এর সব ঘর পূরণ করুন', 'error');
          return;
        }

        questions.push({
          article_id: parseInt(selectedArticleId),
          question_text: text,
          options: [a, b, c, d],
          correct_answer: correct,
          category: 'set_' + nextSetNumber
        });
      }

      const { error } = await sb.from('questions').insert(questions);

      if (error) {
        showToast('সেভ করতে সমস্যা: ' + error.message, 'error');
        console.error(error);
        return;
      }

      showToast('সেট ' + nextSetNumber + ' সফলভাবে যোগ হয়েছে!');

      // ফর্ম ক্লিয়ার
      for (let i = 1; i <= 5; i++) {
        document.getElementById('q' + i + '_text').value = '';
        document.getElementById('q' + i + '_a').value = '';
        document.getElementById('q' + i + '_b').value = '';
        document.getElementById('q' + i + '_c').value = '';
        document.getElementById('q' + i + '_d').value = '';
        document.getElementById('q' + i + '_correct').value = '0';
      }

      nextSetNumber++;
      document.getElementById('setInfo').innerHTML = 'পরবর্তী সেট নম্বর: <strong>সেট ' + nextSetNumber + '</strong> (অটো)';
      loadExistingSets();
    });

    async function loadExistingSets() {
      if (!selectedArticleId) return;

      const { data } = await sb
        .from('questions')
        .select('category')
        .eq('article_id', selectedArticleId);

      const container = document.getElementById('existingSets');

      if (!data || data.length === 0) {
        container.innerHTML = '<p class="text-muted text-center">এখনো কোনো সেট নেই</p>';
        return;
      }

      const sets = {};
      data.forEach(function(q) {
        const cat = q.category || 'set_1';
        sets[cat] = (sets[cat] || 0) + 1;
      });

      const setNames = Object.keys(sets).sort(function(a, b) {
        return parseInt(a.replace('set_', '')) - parseInt(b.replace('set_', ''));
      });

      let html = '';
      setNames.forEach(function(s) {
        const num = s.replace('set_', '');
        html += '<div style="padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.08);">' +
                '<strong>সেট ' + num + '</strong>' +
                '<span class="text-muted" style="font-size:0.85rem;"> • ' + sets[s] + 'টি প্রশ্ন</span>' +
                '</div>';
      });
      container.innerHTML = html;
    }

    init();
  </script>
</body>
</html>
