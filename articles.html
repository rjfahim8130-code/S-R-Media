<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>প্রবন্ধসমূহ - NnowQuiz</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
</head>
<body>
  <div class="container page">
    <div class="header">
      <button class="back-btn" onclick="location.href='home.html'">←</button>
      <div class="logo">প্রবন্ধসমূহ</div>
      <div style="width:40px;"></div>
    </div>

    <div id="articlesList">
      <div class="loading"><div class="spinner"></div><p>প্রবন্ধ লোড হচ্ছে...</p></div>
    </div>
  </div>

  <div class="bottom-nav">
    <a href="home.html" class="nav-item"><span class="icon">🏠</span><span>হোম</span></a>
    <a href="articles.html" class="nav-item active"><span class="icon">📚</span><span>প্রবন্ধ</span></a>
    <a href="leaderboard.html" class="nav-item"><span class="icon">🏆</span><span>র‍্যাঙ্ক</span></a>
    <a href="profile.html" class="nav-item"><span class="icon">👤</span><span>প্রোফাইল</span></a>
  </div>

  <script>
    async function loadArticles() {
      const { data, error } = await sb
        .from('articles')
        .select('*')
        .eq('is_active', true)
        .order('sort_order');

      const container = document.getElementById('articlesList');

      if (error || !data || data.length === 0) {
        container.innerHTML = '<p class="text-muted text-center mt-4">কোনো প্রবন্ধ নেই</p>';
        return;
      }

      container.innerHTML = data.map(a => `
        <div class="card" onclick="location.href='article.html?id=${a.id}'" style="cursor:pointer;">
          <div style="font-weight:700;font-size:1.05rem;margin-bottom:6px;">${a.title}</div>
          <div class="text-muted" style="font-size:0.85rem;">
            ${a.content ? a.content.substring(0, 100) + '...' : ''}
          </div>
        </div>
      `).join('');
    }

    loadArticles();
  </script>
</body>
</html>
