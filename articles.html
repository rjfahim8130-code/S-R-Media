<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>প্রবন্ধ - NnowQuiz</title>
  
  <meta name="monetag" content="5d5bd8350ba1e36f1af8d3b4b95c4595">
  <meta name="8645434d5e68c17799df1ccb083d05cc97221a9c" content="8645434d5e68c17799df1ccb083d05cc97221a9c" />
  <meta name="clckd" content="85de58977d8432e90f4c1b625a374f3d" />

  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="ads.js"></script>
</head>
<body>
  <div class="container page">
    <div class="header">
      <button class="back-btn" onclick="location.href='home.html'">←</button>
      <div class="logo">প্রবন্ধসমূহ</div>
      <div style="width:40px;"></div>
    </div>

    <div class="card">
      <p class="text-muted" style="font-size:0.95rem;">ফ্রি প্রবন্ধ পড়ে জ্ঞান বাড়ান। এখানে পড়লেও বিজ্ঞাপন থেকে পয়েন্ট জমা হয়।</p>
    </div>

    <div id="articlesList">
      <div class="card text-center">
        <p class="text-muted">প্রবন্ধ লোড হচ্ছে...</p>
      </div>
    </div>

    <div id="articlesBannerAd" style="min-height:90px;margin:16px 0;display:flex;justify-content:center;"></div>
  </div>

  <div class="bottom-nav">
    <a href="home.html" class="nav-item">
      <span>🏠</span>
      <span>হোম</span>
    </a>
    <a href="articles.html" class="nav-item active">
      <span>📖</span>
      <span>প্রবন্ধ</span>
    </a>
    <a href="leaderboard.html" class="nav-item">
      <span>🏆</span>
      <span>লিডারবোর্ড</span>
    </a>
    <a href="profile.html" class="nav-item">
      <span>👤</span>
      <span>প্রোফাইল</span>
    </a>
  </div>

  <script>
    let interstitialTimer = null;

    async function init() {
      const user = await requireAuth();
      if (!user) return;

      AdManager.showBanner('articlesBannerAd');
      loadArticles();

      // ফ্রি প্রবন্ধ পেজে ৮-১০ মিনিট পর পর Interstitial
      interstitialTimer = setInterval(() => {
        AdManager.showInterstitial();
      }, 9 * 60 * 1000); // ৯ মিনিট
    }

    async function loadArticles() {
      const { data, error } = await sb.from('articles')
        .select('id, title, created_at')
        .eq('is_active', true)
        .order('sort_order', { ascending: true });

      const list = document.getElementById('articlesList');

      if (error || !data || data.length === 0) {
        list.innerHTML = `<div class="card text-center"><p class="text-muted">কোনো প্রবন্ধ পাওয়া যায়নি</p></div>`;
        return;
      }

      list.innerHTML = data.map(a => `
        <div class="card" style="cursor:pointer;" onclick="location.href='article.html?id=${a.id}'">
          <div class="card-title" style="margin-bottom:6px;">${a.title}</div>
          <p class="text-muted" style="font-size:0.85rem;">পড়তে ক্লিক করুন →</p>
        </div>
      `).join('');
    }

    // পেজ ছাড়ার সময় টাইমার বন্ধ
    window.addEventListener('beforeunload', () => {
      if (interstitialTimer) clearInterval(interstitialTimer);
    });

    init();
  </script>
</body>
</html>
